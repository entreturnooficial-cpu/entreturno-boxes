/* =========================================================
   Calendario (agenda de los 3 boxes)
   ========================================================= *//* =========================================================
   Calendario (agenda de los 3 boxes)
   ========================================================= */
function calendar(mode) {
  const c = S.config;
  const date = S.ui.calDate;
  const mon = mondayOf(date);
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(mon, i));
  const t = todayIso();
  const minWeek = mondayOf(t);
  const maxWeek = addDays(minWeek, 7 * (S.config.weeksAhead || 8));
  const u = me();
  const sun = addDays(mon, 5);
  const wkLabel = fromIso(mon).getMonth() === fromIso(sun).getMonth()
    ? `${fromIso(mon).getDate()} al ${fromIso(sun).getDate()} de ${MESES[fromIso(sun).getMonth()]}`
    : `${fromIso(mon).getDate()} de ${MESES[fromIso(mon).getMonth()]} al ${fromIso(sun).getDate()} de ${MESES[fromIso(sun).getMonth()]}`;

  const chips = days.map(d => {
    const open = c.days.includes(weekday(d));
    const segs = open ? S.boxes.flatMap(b => segments(d, b.id)) : [];
    let info;
    if (!open) info = `<span class="df">cerrado</span>`;
    else if (mode === "pro") { const n = segs.filter(s => s.bookable).length; info = `<span class="df ${n ? "has" : ""} num">${n ? n + (n === 1 ? " libre" : " libres") : "completo"}</span>`; }
    else { const n = segs.filter(s => s.kind === "booking").length; info = `<span class="df num">${n} ${n === 1 ? "reserva" : "reservas"}</span>`; }
    return `<button class="day ${d < t ? "past" : ""} ${open ? "" : "closed"} ${d === t ? "is-today" : ""}" aria-pressed="${d === date}" data-action="cal-day" data-date="${d}">
      <span class="dn">${DIAS_C[weekday(d)]}</span><span class="dd num">${fromIso(d).getDate()}</span>${info}${d === t ? '<span class="sr-only">hoy</span>' : ""}</button>`;
  }).join("");

  const open = c.days.includes(weekday(date));
  const H = c.close - c.open;
  const axis = Array.from({ length: H + 1 }, (_, i) => c.open + i).filter((h, i) => i % 2 === 0 || i === H)
    .map(h => `<span class="num" style="top:calc(var(--ph) * ${h - c.open})">${h}</span>`).join("");

  const lanes = S.boxes.map(box => {
    const segs = segments(date, box.id);
    const pieces = segs.map(s => segHtml(s, box, date, mode, u)).join("");
    return `<div class="lane" style="height:calc(var(--ph) * ${H})">${pieces}</div>`;
  }).join("");

  // La hora actual, solo si se está mirando el día de hoy y el consultorio está abierto
  const nowH = date === t ? (Date.now() - at(date, 0).getTime()) / 36e5 : -1;
  const nowLine = nowH > c.open && nowH < c.close
    ? `<div class="nowline" data-open="${c.open}" data-close="${c.close}" style="top:calc(var(--ph) * ${(nowH - c.open).toFixed(3)})" aria-hidden="true"></div>` : "";

  const legend = mode === "pro"
    ? `<span><i class="sw sw-free"></i>Libre</span><span><i class="sw sw-rel"></i>Rato libre</span><span><i class="sw sw-mine"></i>Tu reserva</span><span><i class="sw sw-busy"></i>Ocupado</span><span><i class="sw sw-block"></i>No disponible</span>`
    : `<span><i class="sw sw-free"></i>Libre</span><span><i class="sw sw-rel"></i>Rato libre publicado</span><span><i class="sw sw-busy"></i>Reservado</span><span><i class="sw sw-block"></i>Lo usás vos</span>`;

  return `
  <div class="cal-head">
    <span class="wk"><span class="wk-l">Semana del ${wkLabel}</span><span class="wk-s">${fromIso(mon).getDate()} al ${fromIso(sun).getDate()} de ${MESES_C[fromIso(sun).getMonth()]}.</span></span>
    <button class="btn btn-sm" data-action="cal-today">Hoy</button>
    <button class="iconbtn" data-action="cal-week" data-dir="-1" aria-label="Semana anterior" ${mode === "pro" && mon <= minWeek ? "disabled" : ""}>${ic("chevL")}</button>
    <button class="iconbtn" data-action="cal-week" data-dir="1" aria-label="Semana siguiente" ${mode === "pro" && mon >= maxWeek ? "disabled" : ""}>${ic("chevR")}</button>
  </div>
  <div class="days" role="group" aria-label="Días de la semana">${chips}</div>
  <div class="legend" aria-label="Referencias">${legend}</div>
  <section class="cal ${fx === "cal" ? "fx-in" : ""}" aria-label="Horarios del ${fmtDay(date)}">
    ${open ? `
    <div class="cal-cols">
      <div></div>
      ${S.boxes.map(b => `<div class="cal-boxh"><span class="plate num" aria-hidden="true">${b.id}</span><div class="bx-txt"><b>${esc(b.name)}</b><span class="sh">${esc(b.short)}</span></div></div>`).join("")}
    </div>
    <div class="cal-cols">
      <div class="axis" style="height:calc(var(--ph) * ${H})">${axis}</div>
      ${lanes}
      ${nowLine}
    </div>` : `<div class="cal-closed"><b style="display:block;color:var(--text)">El consultorio no abre los ${DIAS[weekday(date)]}.</b>Elegí otro día de la semana.</div>`}
  </section>`;
}

function segHtml(s, box, date, mode, u) {
  const h = s.end - s.start;
  const style = `top:calc(var(--ph) * ${s.start - S.config.open} + 2px);height:calc(var(--ph) * ${h} - 4px)`;
  const short = h < 2 ? "short" : "";
  const data = `data-box="${box.id}" data-date="${date}" data-start="${s.start}" data-end="${s.end}"`;
  const tm = `<span class="tm num">${fmtRange(s.start, s.end)}</span>`;
  const past = s.past ? "past" : "";
  if (mode === "pro") {
    if (s.kind === "free") return s.bookable
      ? `<button class="seg seg-free ${short}" style="${style}" ${data} data-action="book" aria-label="Reservar ${esc(box.name)}, ${fmtRange(s.start, s.end)}"><span class="k">Libre</span>${tm}<span class="pr num">${money(priceFor(h, u, box.id))}</span></button>`
      : `<div class="seg seg-gone past ${short}" style="${style}"><span class="k">Pasado</span></div>`;
    if (s.kind === "release") return s.bookable
      ? `<button class="seg seg-rel ${short}" style="${style}" ${data} data-action="book" aria-label="Reservar rato libre ${esc(box.name)}, ${fmtRange(s.start, s.end)}"><span class="k">Rato libre</span>${tm}<span class="pr num">${money(priceFor(h, u, box.id))}</span></button>`
      : `<div class="seg seg-gone past ${short}" style="${style}"><span class="k">Pasado</span></div>`;
    if (s.kind === "block") return `<div class="seg seg-block ${past} ${short}" style="${style}"><span class="k">No disponible</span></div>`;
    if (s.kind === "gap") return `<div class="seg seg-gap" style="${style}"></div>`;
    const b = s.ref;
    if (b.userId === u.id) return `<button class="seg seg-mine ${short}" style="${style}" data-action="my-booking" data-id="${b.id}"><span class="k">Tu reserva</span>${tm}<span class="pill ${STATUS[b.status].cls}">${STATUS[b.status].short}</span></button>`;
    return `<div class="seg seg-busy ${past} ${short}" style="${style}"><span class="k">Ocupado</span></div>`; // RN09: sin nombre ni servicio
  }
  // Administradora: ve todo con detalle (RF11) y gestiona bloqueos (RF06, RF07)
  if (s.kind === "free" || s.kind === "gap") return `<button class="seg seg-free admin ${short} ${s.past ? "past" : ""}" style="${style}" ${data} data-action="adm-free" ${s.past ? "disabled" : ""}><span class="k">Libre</span>${tm}</button>`;
  if (s.kind === "release") return `<button class="seg seg-rel admin ${short} ${past}" style="${style}" ${data} data-action="adm-release" data-id="${s.ref.id}"><span class="k">Rato libre publicado</span>${tm}</button>`;
  if (s.kind === "block") return `<button class="seg seg-block admin ${short} ${past}" style="${style}" ${data} data-action="adm-block" data-id="${s.ref.id}"><span class="k">${esc(s.ref.note || "Lo usás vos")}</span>${tm}</button>`;
  const b = s.ref, who = userById(b.userId);
  return `<button class="seg seg-busy admin ${short}" style="${style}" data-action="adm-booking" data-id="${b.id}"><span class="k">${esc(who.name)}</span><span class="tm">${esc(b.service || who.profession)}</span><span class="pill ${STATUS[b.status].cls}">${STATUS[b.status].short}</span></button>`;
}

/* =========================================================
   Vistas: profesional
   ========================================================= */
function firstFreeDay() {
  let d = todayIso();
  for (let i = 0; i < 56; i++, d = addDays(d, 1)) if (S.boxes.some(b => segments(d, b.id).some(s => s.bookable))) return d;
  return todayIso();
}
function viewReservar() {
  const c = S.config;
  if (!S.ui.calPicked) { S.ui.calDate = firstFreeDay(); S.ui.calPicked = true; }
  const mon = mondayOf(S.ui.calDate);
  let free = 0;
  for (let i = 0; i < 6; i++) { const d = addDays(mon, i); S.boxes.forEach(b => { free += segments(d, b.id).filter(s => s.bookable).length; }); }
  const rel = S.releases.filter(r => r.date >= todayIso() && canBook(r.boxId, r.date, r.start, r.end)).sort((a, b) => a.date.localeCompare(b.date))[0];
  return `
  <div class="title-row"><div>
    <h1>Reservar un box</h1>
    <p class="sub">Tocá un horario libre. Turnos de ${c.turnHours} h a ${money(priceFor(c.turnHours))}: tu precio es de ${money(rateOf(me()))} la hora (${esc(catOf(me()).name.toLowerCase())}).${ownRates(me())}</p>
    <p class="finding">${free ? `Esta semana quedan <b class="num">${free}</b> ${free === 1 ? "turno libre" : "turnos libres"}.` : "Esta semana está completa. Mirá la que viene."}
      ${rel ? ` Hay un rato libre el <b>${fmtDay(rel.date)}</b> en ${esc(boxById(rel.boxId).name)}, de ${fmtRange(rel.start, rel.end)}.` : ""}</p>
  </div></div>
  ${calendar("pro")}`;
}

function myBookings() { return S.bookings.filter(b => b.userId === me().id); }

function viewMis() {
  const tab = S.ui.tab.mis || "proximas";
  const all = myBookings(), sd = saldos();
  // Los turnos que ya pasaron y todavía se deben van arriba de todo, con las próximas
  const debe = all.filter(b => b.status === "cumplida" && balanceOf(b)).sort((a, b) => bookingStart(a) - bookingStart(b));
  const prox = [...debe, ...all.filter(b => ["pago", "confirmada"].includes(b.status)).sort((a, b) => bookingStart(a) - bookingStart(b))];
  const hist = all.filter(b => (b.status === "cumplida" && !balanceOf(b)) || b.status === "cancelada").sort((a, b) => bookingStart(b) - bookingStart(a));
  const list = tab === "proximas" ? prox : hist;
  const toPay = prox.filter(b => b.status === "pago").length;
  const proxima = prox.find(b => b.status !== "cumplida");
  const finding = debe.length ? `Tenés <b>el saldo de ${debe.length === 1 ? "un turno que ya pasó" : debe.length + " turnos que ya pasaron"} sin pagar</b>: ${money(debe.reduce((a, b) => a + balanceOf(b), 0))}.${sd.bloqueado ? " Pagalo para volver a reservar." : ""}`
    : toPay ? `Tenés <b>${toPay} ${toPay === 1 ? "reserva" : "reservas"} sin pagar</b>: pagala antes de que se libere el horario.`
    : proxima ? `Tu próximo turno es el <b>${fmtDay(proxima.date)}</b>, ${esc(boxById(proxima.boxId).name)}, de ${fmtRange(proxima.start, proxima.end)}.` : "No tenés turnos próximos.";
  return `
  <div class="title-row"><div>
    <h1>Mis reservas</h1>
    <p class="finding">${finding}</p>
  </div><button class="btn btn-primary" data-nav="reservar">Reservar otro turno</button></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${tab === "proximas"}" data-action="tab" data-k="mis" data-v="proximas">Próximas<span class="n num">${prox.length}</span></button>
    <button role="tab" aria-selected="${tab === "historial"}" data-action="tab" data-k="mis" data-v="historial">Historial<span class="n num">${hist.length}</span></button>
  </div>
  <div class="panel">${list.length ? list.map(bookingCard).join("") : `<div class="empty"><b>${tab === "proximas" ? "No tenés reservas próximas" : "Todavía no hay historial"}</b>${tab === "proximas" ? "Elegí un horario libre en Reservar." : "Acá vas a ver tus turnos cumplidos y cancelados."}</div>`}</div>`;
}

function bookingCard(b) {
  const box = boxById(b.boxId), d = fromIso(b.date), paid = paidOf(b), bal = balanceOf(b);
  let pay = "";
  if (b.status === "pago") pay = `<span class="timer" data-countdown="${b.expiresAt}"></span> para pagar`;
  else if (b.status === "confirmada") pay = bal ? `Pagaste ${money(paid)} de seña · saldo <b class="num">${money(bal)}</b> antes del turno` : b.total ? `Pagaste el total: <b class="num">${money(paid)}</b>` : "Sin cargo";
  else if (b.status === "cumplida") pay = bal ? `Pagaste ${money(paid)} · <b class="num">te falta el saldo: ${money(bal)}</b>` : `Pagado ${money(paid)}`;
  else if (b.status === "cancelada") pay = b.cancelledBy === "vencida" ? "Se liberó porque no se registró el pago a tiempo." : b.refund?.amount ? `Devolución ${money(b.refund.amount)} (${b.refund.pct} %)${b.refund.done ? "" : " · en camino"}` : "Sin devolución";
  // un pago que entró de más (repetido, o que llegó cuando el turno ya no estaba): se devuelve entero, solo
  if (sobranteOf(b)) pay += `${pay ? " · " : ""}Te devolvemos <b class="num">${money(sobranteOf(b))}</b> que pagaste de más (puede tardar unos días)`;
  const acts = [];
  if (b.status === "pago") {
    acts.push(`<button class="btn btn-primary btn-sm" data-action="pay-now" data-id="${b.id}">Pagar ${money(b.plan === "sena" ? depositOf(b) : b.total)}</button>`);
    acts.push(`<button class="btn btn-sm" data-action="cancel" data-id="${b.id}">Cancelar</button>`);
  }
  if (["confirmada", "cumplida"].includes(b.status) && bal) acts.push(`<button class="btn btn-sm ${b.status === "cumplida" ? "btn-primary" : ""}" data-action="pay-balance" data-id="${b.id}">Pagar saldo</button>`);
  if (b.status === "confirmada") acts.push(`<button class="btn btn-sm btn-danger" data-action="cancel" data-id="${b.id}">Cancelar</button>`);
  return `<article class="bk">
    <div class="bk-date"><div class="m">${MESES_C[d.getMonth()]}</div><div class="d num">${d.getDate()}</div><div class="w">${DIAS_C[d.getDay()]}</div></div>
    <div>
      <div class="t">${esc(box.name)} <span class="hr num">${fmtRange(b.start, b.end)}</span></div>
      <div class="s">${cap(fmtDay(b.date))} · ${esc(b.service || "")}${machinesOf(b).length ? ` · con ${machinesOf(b).map(m => esc(m.name)).join(", ")}` : ""}</div>
      <div style="margin-top:8px">${statusPill(b)}</div>
      <div class="pay">${pay}</div>
    </div>
    <div class="acts">${acts.join("")}</div>
  </article>`;
}

/* La foto del box o, si todavía no tiene, el plano (que está dibujado para un consultorio de tres boxes) */
const boxArt = (b) => b.photo ? `<img class="foto" src="${esc(b.photo)}" alt="Foto de ${esc(b.name)}">` : planSvg(S.boxes.length === 3 && b.id >= 1 && b.id <= 3 ? b.id : 0);

function viewBoxes() {
  return `
  <div class="title-row"><div>
    <h1>Los boxes</h1>
    <p class="sub">Los espacios equipados del consultorio. Elegí el que mejor se adapte a lo que atendés.</p>
  </div></div>
  <div class="boxes">${S.boxes.map(b => `
    <article class="boxcard">

/* Lo único que espera a la dueña son los pedidos de acceso: los pagos y las devoluciones se registran solos */
const accessRequests = () => S.users.filter(u => u.role === "pro" && u.status === "pendiente");

function weekStats() {
  const t = todayIso();
  let rentable = 0, booked = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(t, i);
    S.boxes.forEach(b => segments(d, b.id).forEach(s => {
      const h = s.end - s.start;
      if (s.past) return;
      if (s.kind === "booking") { booked += h; rentable += h; }
      else if (s.kind === "free" || s.kind === "release") rentable += h;
    }));
  }
  return { rentable, booked, pct: rentable ? Math.round(booked / rentable * 100) : 0 };
}
function monthMoney() {
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  let cobrado = 0, devuelto = 0;
  S.bookings.forEach(b => b.payments.forEach(p => {
    const d = new Date(p.at); if (d.getMonth() !== m || d.getFullYear() !== y || p.status !== "aprobado") return;
    if (p.kind === "devolucion") devuelto += p.amount; else cobrado += p.amount;
  }));
  const porCobrar = S.bookings.filter(b => ["confirmada", "cumplida"].includes(b.status)).reduce((a, b) => a + balanceOf(b), 0);
  return { cobrado, devuelto, porCobrar };
}

const AG_VIEWS = [["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"], ["dias", "Días"]];

const agHead = (label, prev, next) => `<div class="cal-head"><span class="wk">${label}</span>

/* Varios días seguidos, uno debajo del otro, cada uno con sus tres boxes */
function agendaList(start, n) {
  const t = todayIso(), end = addDays(start, n - 1), a = fromIso(start), b = fromIso(end);
  const label = n === 1 ? cap(fmtDay(start)) : a.getMonth() === b.getMonth()
    ? `${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}` : `${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]}`;
  const slot = (s, box, d) => {
    const who = s.kind === "booking" ? esc(userById(s.ref.userId).name) : s.kind === "block" ? esc(s.ref.note || "Lo usás vos") : s.kind === "release" ? "Rato libre publicado" : s.past ? "Sin alquilar" : "Libre";
    const kind = s.kind === "booking" ? "busy" : s.kind === "block" ? "block" : s.kind === "release" ? "rel" : s.past ? "gone" : "free";
    const data = `data-box="${box.id}" data-date="${d}" data-start="${s.start}" data-end="${s.end}"`;
    const act = s.kind === "booking" ? `data-action="adm-booking" data-id="${s.ref.id}"` : s.kind === "block" ? `data-action="adm-block" data-id="${s.ref.id}" ${data}`
      : s.kind === "release" ? `data-action="adm-release" data-id="${s.ref.id}" ${data}` : s.past ? "" : `data-action="adm-free" ${data}`;
    return `<li class="slot slot-${kind} ${act ? "click" : ""}" ${act} ${act ? 'tabindex="0" role="button"' : ""}><span class="hr num">${fmtRange(s.start, s.end)}</span><span class="who">${who}</span></li>`;
  };
  const days = Array.from({ length: n }, (_, i) => addDays(start, i));
  return `${agHead(label, "Días anteriores", "Días siguientes")}
  <div class="aglist ${fx === "cal" ? "fx-in" : ""}">${days.map(d => {
    const open = S.config.days.includes(weekday(d));
    const nb = S.bookings.filter(x => x.date === d && active(x)).length;
    return `<section class="panel agday ${d < t ? "past" : ""}">
      <div class="panel-h"><h2>${cap(fmtDay(d))}${d === t ? ' <span class="pill pill-neutral">Hoy</span>' : ""}</h2>
        ${open ? `<button class="btn btn-text btn-sm" data-action="ag-day" data-date="${d}">${nb} ${nb === 1 ? "reserva" : "reservas"} · ver el día</button>` : `<span class="muted small">Cerrado</span>`}</div>
      <div class="panel-b">${open ? `<div class="today-cols">${S.boxes.map(box => `<div><div class="cal-boxh"><span class="plate num" aria-hidden="true">${box.id}</span><div class="bx-txt"><b>${esc(box.name)}</b></div></div><ul class="slots">${segments(d, box.id).filter(s => s.kind !== "gap").map(s => slot(s, box, d)).join("")}</ul></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">El consultorio no abre los ${DIAS[weekday(d)]}.</p>`}</div>
    </section>`; }).join("")}</div>`;
}

/* El mes entero: cada día con sus reservas y cuánto está alquilado. Tocar un día lo abre. */
function agendaMonth() {
  const t = todayIso(), ym = ymOf(S.ui.calDate), [y, m] = ym.split("-").map(Number);
  const nDays = new Date(y, m, 0).getDate(), lead = (weekday(ym + "-01") + 6) % 7; // la semana empieza el lunes
  const cells = Array.from({ length: lead }, () => `<div class="mday out"></div>`);
  for (let n = 1; n <= nDays; n++) {
    const d = `${ym}-${pad(n)}`, open = S.config.days.includes(weekday(d));
    let booked = 0, rentable = 0;
    if (open) S.boxes.forEach(b => segments(d, b.id).forEach(s => { const h = s.end - s.start; if (s.kind === "booking") { booked += h; rentable += h; } else if (s.kind === "free" || s.kind === "release") rentable += h; }));
    const nb = S.bookings.filter(x => x.date === d && active(x)).length, pct = rentable ? Math.round(booked / rentable * 100) : 0;
    cells.push(`<button class="mday ${open ? "" : "closed"} ${d < t ? "past" : ""} ${d === t ? "is-today" : ""}" data-action="ag-day" data-date="${d}" aria-label="${cap(fmtDay(d))}: ${open ? nb + (nb === 1 ? " reserva" : " reservas") : "cerrado"}">
      <span class="dn num">${n}</span>
      ${open ? `<span class="mr num">${nb ? nb + (nb === 1 ? " reserva" : " reservas") : "Sin reservas"}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="mp num">${pct} % alquilado</span>` : `<span class="mr">Cerrado</span>`}
    </button>`);
  }
  return `${agHead(cap(ymLabel(ym)), "Mes anterior", "Mes siguiente")}
  <section class="panel month ${fx === "cal" ? "fx-in" : ""}"><div class="mhead">${["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(x => `<span>${x}</span>`).join("")}</div><div class="mgrid">${cells.join("")}</div></section>`;
}

/* Por qué no salió una devolución, dicho en criollo (lo que anota el servidor viene con las palabras de Mercado Pago) */
function notaDeMp(t) {
  if (!t) return "";
  if (/^otra_cuenta/.test(t)) return " · no sale sola: ese pago se cobró con otra cuenta de Mercado Pago. Devolvela desde esa cuenta y anotala como hecha";
  if (/insufficient|saldo/i.test(t)) return " · no salió: la cuenta de Mercado Pago no tiene saldo disponible";
  if (/no está conectada|configurar/i.test(t)) return " · no salió: la cuenta de Mercado Pago no está conectada";
  if (/sin_respuesta/i.test(t)) return " · Mercado Pago no contestó: se intenta de nuevo";
  if (/cancelada|vencido|hecho/i.test(t)) return ` · ${esc(t)}`;         // el motivo de un pago que entró de más
  return " · no salió: Mercado Pago no la aceptó";
}

/* La cuenta de Mercado Pago del consultorio, en Configuración (solo la ve la dueña) */

  const cuenta = a ? `<b>${esc(a.name || "Cuenta de Mercado Pago")}</b><div class="s">${a.email ? esc(a.email) + " · " : ""}N.º <span class="num">${esc(a.userId)}</span></div>` : "";
  if (!a) {
    return `${modo}<p class="muted">Todavía no hay ninguna cuenta conectada.</p>
      <div class="acts"><button class="btn btn-dark" data-action="mp-conectar">Conectar Mercado Pago</button></div>`;
  }
  if (a.status === "por_confirmar") {
    return `${modo}<ul class="list"><li class="li"><div class="main">${cuenta}</div><span class="pill pill-warning">Falta confirmar</span></li></ul>
      <p class="muted">Mercado Pago ya autorizó esta cuenta. Falta que confirmes que es la tuya.</p>
      <div class="acts"><button class="btn" data-action="mp-quitar">Quitarla</button><button class="btn btn-dark" data-action="mp-revisar">Confirmar la cuenta</button></div>`;
  }
  if (a.status === "caida") {
    return `${modo}<ul class="list"><li class="li"><div class="main">${cuenta}</div><span class="pill pill-negative">Desconectada</span></li></ul>
      <div class="note warn">La cuenta dejó de estar conectada (pasa si se le quita el permiso a Entreturno en Mercado Pago o si se cambia la contraseña). Hasta conectarla de nuevo no se puede cobrar ni devolver.</div>
      <div class="acts"><button class="btn" data-action="mp-quitar">Quitarla</button><button class="btn btn-dark" data-action="mp-conectar">Conectar de nuevo</button></div>`;
  }
  const otroModo = a.env !== mp.env;
  return `${modo}<ul class="list"><li class="li"><div class="main">${cuenta}</div><span class="pill ${otroModo ? "pill-warning" : "pill-positive"}">${otroModo ? "Hay que reconectar" : "Conectada"}</span></li></ul>
    ${otroModo ? `<div class="note warn">Esta cuenta se conectó en modo ${a.env === "prueba" ? "prueba" : "real"} y hoy el consultorio cobra en modo ${real ? "real" : "prueba"}. Conectala de nuevo.</div>` : ""}
    <div class="acts"><button class="btn" data-action="mp-quitar">Desconectar</button>${otroModo ? `<button class="btn btn-dark" data-action="mp-conectar">Conectar de nuevo</button>` : ""}</div>`;
}

function viewPagos() {
  const hist = [];
  S.bookings.forEach(b => b.payments.forEach(p => { if (p.status === "aprobado") hist.push({ b, p }); }));
  hist.sort((x, y) => y.p.at - x.p.at);
  const amt = (p) => `${p.kind === "devolucion" ? "− " : ""}${money(p.amount)}`;
  // Lo que todavía hay que devolver por Mercado Pago: devoluciones de cancelaciones y pagos que entraron de más
  const esperan = [];
  S.bookings.forEach(b => {
    b.payments.forEach(p => { if (p.kind === "devolucion" && p.status === "pendiente") esperan.push({ b, id: p.id, monto: p.amount, que: "Devolución por cancelación", nota: p.note }); });
    (b.surplus || []).forEach(x => { if (!x.done) esperan.push({ b, id: x.id, monto: x.amount, que: "Pago que entró de más", nota: x.note }); });
  });
  return `
  <div class="title-row"><div><h1>Pagos</h1><p class="sub">${S.site.payments === "simulado" ? "Modo de prueba: los pagos son simulados, todavía no se cobra plata de verdad." : mpDePrueba() ? "Mercado Pago en modo prueba: se paga con tarjetas de prueba y no se mueve plata de verdad." : "Los cobros y las devoluciones pasan por Mercado Pago y se registran solos."}</p></div></div>
  ${esperan.length ? `<div class="panel" id="devoluciones-esperan"><div class="panel-b">
    <div class="group-l">Devoluciones que están saliendo</div>
    <p class="muted" style="margin:4px 0 10px">El sistema las hace solo desde tu cuenta de Mercado Pago. Si alguna no sale (lo más común: la cuenta no tiene saldo disponible), la sigue intentando. Si la hacés vos por tu cuenta, marcala como hecha.</p>
    <ul class="list">${esperan.map(x => `<li class="li"><div class="main"><div class="t">${esc(userById(x.b.userId).name)} · <span class="num">${money(x.monto)}</span></div>
      <div class="s">${x.que} · ${esc(boxById(x.b.boxId).name)}, ${fmtDayShort(x.b.date)}${notaDeMp(x.nota)}</div></div>
      ${x.nota ? `<div class="acts"><button class="btn btn-sm" data-action="mp-a-mano" data-id="${x.id}">Ya la devolví yo</button></div>` : ""}</li>`).join("")}</ul>
    <div class="acts"><button class="btn" data-action="mp-despachar">Intentar ahora</button></div>
  </div></div>` : ""}
  <div class="panel"><div class="panel-b" style="padding-top:8px">${hist.length ? `
    <div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Profesional</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>
    ${hist.map(({ b, p }) => `<tr><td class="num">${fmtWhen(p.at)}</td><td>${esc(userById(b.userId).name)}</td><td>${KIND[p.kind]}<div class="s">${esc(boxById(b.boxId).name)}, ${fmtDayShort(b.date)}</div></td><td class="num">${amt(p)}</td></tr>`).join("")}</tbody></table></div>
    <div class="mrows">${hist.map(({ b, p }) => `<div class="mrow" style="cursor:default"><div class="main"><div class="l1"><span>${esc(userById(b.userId).name)}</span><span class="num">${amt(p)}</span></div><div class="l2">${KIND[p.kind]} · ${esc(boxById(b.boxId).name)}, ${fmtDayShort(b.date)} · ${fmtWhen(p.at)}</div></div></div>`).join("")}</div>`
    : `<div class="empty"><b>Todavía no hay pagos</b>Cuando alguien reserve y pague, aparece acá.</div>`}</div></div>`;
}

function estadoFactura(r, corto) {
  const inv = r.invoice;
  if (emitida(r)) {
    const d = diferencia(r), aviso = d ? `<div class="s">Cambió después: ${d > 0 ? "falta facturar" : "se facturó de más"} ${money(Math.abs(d))}</div>` : "";
    return corto ? `<span class="pill pill-positive">Facturada · ${inv.letter} ${inv.number}</span>${aviso}` : `<span class="pill pill-positive">Facturada</span><div class="s num">${inv.letter} ${inv.number}</div>${aviso}`;
  }
  if (inv && inv.status === "incierta") return `<span class="pill pill-warning">En duda</span>${corto ? "" : `<div class="s">Facturá de nuevo en unos minutos</div>`}`;
  if (inv && inv.status === "rechazada") return `<span class="pill pill-negative">Rechazada</span>`;
  if (inv && inv.status === "revisar") return `<span class="pill pill-negative">Revisar</span>`;
  if (!datosFiscalesOk(r.u)) return `<span class="pill pill-warning">Faltan datos</span>${corto ? "" : `<div class="s">${cuitOk(r.u.cuit) ? "Condición de IVA" : "CUIT"}</div>`}`;
  return `<span class="pill pill-warning">Sin facturar</span>`;
}

function viewFacturacion() {
  const nowYm = ymOf(todayIso()), ym = S.ui.invYm || nowYm, bl = S.config.billing || {};
  const env = bl.env || "apagado", cerrado = ym < nowYm;
  const rows = billingRows(ym);
  const pend = rows.filter(r => !emitida(r) && r.total > 0), done = rows.filter(emitida);
  const listas = pend.filter(paraFacturar), sinDatos = pend.filter(r => !datosFiscalesOk(r.u) && !enDuda(r)), dudas = rows.filter(enDuda);
  const cambiadas = done.filter(r => diferencia(r) !== 0);
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const unused = pend.reduce((a, r) => a + r.pending, 0);
  const finding = !rows.length ? "No hubo alquileres en este mes."
    : pend.length ? `Hay <b>${pend.length} ${pend.length === 1 ? "profesional" : "profesionales"} para facturar</b> por ${money(pend.reduce((a, r) => a + r.total, 0))}.${sinDatos.length ? ` ${sinDatos.length === 1 ? "A una le falta" : `A ${sinDatos.length} les falta`} la CUIT o la condición de IVA.` : ""}${ym === nowYm && unused ? ` El mes no terminó: ${unused} ${unused === 1 ? "turno todavía no se usó" : "turnos todavía no se usaron"}.` : ""}`
    : cambiadas.length ? `Facturado, pero ${cambiadas.length === 1 ? "una cambió" : `${cambiadas.length} cambiaron`} después: hay turnos que se agregaron o se cancelaron. Consultalo con tu contador antes de hacer otra factura.`
    : `Todo facturado: ${done.length} ${done.length === 1 ? "factura" : "facturas"} por ${money(done.reduce((a, r) => a + r.invoice.total, 0))}.`;
  const porQue = env === "apagado" ? "Se activa cuando Entreturno conecte ARCA" : !cerrado ? "Se factura cuando termina el mes" : !listas.length && !dudas.length ? "No hay nada listo para facturar" : "";
  const act = (r) => r.invoice && r.invoice.status !== "pendiente" ? `<button class="btn btn-sm" data-action="inv-open" data-id="${r.invoice.id}">Ver</button>`
    : !datosFiscalesOk(r.u) ? `<button class="btn btn-sm" data-action="user-fiscal" data-id="${r.u.id}">Completar</button>` : "";
  const nota = env === "apagado" ? `La facturación con ARCA todavía no está prendida para tu consultorio: Entreturno la prende cuando quede conectada. Mientras tanto, esta pantalla te muestra cuánto hay que facturarle a cada profesional.`
    : env === "prueba" ? `<b>Modo prueba.</b> Las facturas salen en el ambiente de prueba de ARCA, con datos de prueba de Entreturno: no valen como facturas y no les llegan a las profesionales.`
    : `Las facturas salen con tu CUIT${bl.cuit ? ` (${esc(bl.cuit)})` : ""} y el punto de venta ${pad4(bl.pos)}: una Factura C por profesional, por todas sus horas del mes. A cada una le llega por mail.`;
  return `
  <div class="title-row"><div>
    <h1>Facturación</h1>
    <p class="sub">Las horas que alquiló cada profesional en el mes, con su precio. Se factura todo junto: una factura por profesional.</p>
    <p class="finding">${finding}</p>
  </div><button class="btn btn-primary" data-action="inv-facturar" data-ym="${ym}" ${porQue ? `disabled title="${porQue}"` : ""}>Facturar todo el mes</button></div>
  <div class="cal-head"><span class="wk">${cap(ymLabel(ym))}</span>
    <button class="btn btn-sm" data-action="inv-month" data-go="now">Este mes</button>
    <button class="iconbtn" data-action="inv-month" data-go="-1" aria-label="Mes anterior">${ic("chevL")}</button>
    <button class="iconbtn" data-action="inv-month" data-go="1" aria-label="Mes siguiente" ${ym >= nowYm ? "disabled" : ""}>${ic("chevR")}</button></div>
  ${rows.length ? `
  <div class="panel"><div class="panel-b" style="padding-top:8px">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Profesional</th><th class="num">Horas</th><th class="num">Boxes</th><th class="num">Máquinas</th><th class="num">Total</th><th>Factura</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><div class="t">${esc(r.u.name)}</div><div class="s">${esc(catOf(r.u).name)} · CUIT ${esc(r.u.cuit || "sin cargar")}</div></td>
        <td class="num">${r.hours} h</td><td class="num">${money(r.boxAmount)}</td><td class="num">${r.machAmount ? money(r.machAmount) : "—"}</td><td class="num"><b>${money(r.total)}</b></td>
        <td>${estadoFactura(r)}</td><td class="num">${act(r)}</td></tr>`).join("")}
        <tr class="tot"><td>Total del mes</td><td class="num">${sum("hours")} h</td><td class="num">${money(sum("boxAmount"))}</td><td class="num">${sum("machAmount") ? money(sum("machAmount")) : "—"}</td><td class="num">${money(sum("total"))}</td><td></td><td></td></tr></tbody>
    </table></div>
    <div class="mrows">${rows.map(r => `<div class="mrow" style="cursor:default"><div class="main"><div class="l1"><span>${esc(r.u.name)}</span><span class="num">${money(r.total)}</span></div>
      <div class="l2">${r.hours} h de box${r.machAmount ? " · máquinas " + money(r.machAmount) : ""}</div>
      <div class="inv-line">${estadoFactura(r, true)}${act(r)}</div></div></div>`).join("")}</div>
  </div></div>` : `<div class="panel"><div class="empty"><b>No hay nada para facturar en ${ymLabel(ym)}</b>Cuando haya alquileres en el mes, aparecen acá.</div></div>`}
  <div class="note" style="margin-top:16px">${nota}</div>`;
}

/* Cuánto debe una profesional: los saldos de los turnos que señó y todavía no terminó de pagar */
const debeTxt = (u) => {
  const sd = saldos(u);
  return sd.deuda ? ` · <b>debe ${money(sd.deuda)}</b> de ${sd.conSaldo.length} ${sd.conSaldo.length === 1 ? "turno" : "turnos"}${sd.vencidos.length ? ` (${sd.vencidos.length} ya ${sd.vencidos.length === 1 ? "pasó" : "pasaron"})` : ""}` : "";
};

function viewProfesionales() {
  const tab = S.ui.tab.prof || "solicitudes";
  const pros = S.users.filter(u => u.role === "pro");
  const groups = { solicitudes: pros.filter(u => u.status === "pendiente"), aprobadas: pros.filter(u => u.status === "aprobado"), pausadas: pros.filter(u => u.status === "bloqueado" || u.status === "rechazado") };
  const list = groups[tab];
  const row = (u) => {
    const nb = S.bookings.filter(b => b.userId === u.id && active(b) && b.status !== "cumplida").length;
    let acts = "";
    if (u.status === "pendiente") acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="rechazado">Rechazar</button><button class="btn btn-sm btn-primary" data-action="user-status" data-id="${u.id}" data-s="aprobado">Aprobar</button>`;
    else if (u.status === "aprobado") acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="bloqueado">Pausar acceso</button>`;
    else acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="aprobado">Habilitar</button>`;
    return `<li class="li"><div class="avatar">${initials(u.name)}</div>
      <div class="main"><div class="t">${esc(u.name)} ${u.status === "rechazado" ? '<span class="pill pill-negative">Rechazada</span>' : u.status === "bloqueado" ? '<span class="pill pill-neutral">Pausada</span>' : ""}</div>
      <div class="s">${esc(u.profession)} · ${esc(u.email)} · ${esc(u.phone)}</div>
      <div class="s">CUIT ${esc(u.cuit || "sin cargar")} · ${condIvaTxt(u.ivaCond)} <button class="btn btn-text btn-sm" data-action="user-fiscal" data-id="${u.id}">Cambiar</button></div>
      <div class="s catline"><label>Categoría <select class="input input-sm" data-input="userCat" data-id="${u.id}">${S.config.categories.map(k => `<option value="${k.id}" ${k.id === catOf(u).id ? "selected" : ""}>${esc(k.name)} · ${money(k.pricePerHour)} la hora</option>`).join("")}</select></label></div>
      <div class="s">${u.status === "pendiente" ? "Pidió acceso " + fmtWhen(u.since) : u.status === "aprobado" ? `${nb} ${nb === 1 ? "reserva activa" : "reservas activas"}` : ""}${debeTxt(u)}</div></div>
      <div class="acts">${acts}</div></li>`;
  };
  return `
  <div class="title-row"><div><h1>Profesionales</h1><p class="sub">Solo reservan las que aprobás después de la entrevista. Pasales la dirección de esta página: piden acceso desde ahí y te aparecen acá.</p></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${tab === "solicitudes"}" data-action="tab" data-k="prof" data-v="solicitudes">Solicitudes<span class="n num">${groups.solicitudes.length}</span></button>
    <button role="tab" aria-selected="${tab === "aprobadas"}" data-action="tab" data-k="prof" data-v="aprobadas">Aprobadas<span class="n num">${groups.aprobadas.length}</span></button>
    <button role="tab" aria-selected="${tab === "pausadas"}" data-action="tab" data-k="prof" data-v="pausadas">Pausadas y rechazadas<span class="n num">${groups.pausadas.length}</span></button>
  </div>
  <div class="panel"><div class="panel-b" style="padding-top:8px">${list.length ? `<ul class="list">${list.map(row).join("")}</ul>` : `<div class="empty"><b>No hay nadie acá</b>${tab === "solicitudes" ? "Las nuevas solicitudes de acceso aparecen en esta pestaña." : ""}</div>`}</div></div>`;
}

/* =========================================================
   Hojas (bottom sheet / diálogo)
   ========================================================= */
let overlayEl = null, lastFocus = null;
function openSheet(html, { wide = false } = {}) {
  if (overlayEl) { // ya hay una hoja abierta: reemplazamos el contenido sin animar
    const sh = overlayEl.querySelector(".sheet");
    sh.className = "sheet" + (wide ? " wide" : "");
    sh.innerHTML = html; sh.scrollTop = 0;
    return;
  }
  lastFocus = document.activeElement;
  overlayEl = document.createElement("div");
  overlayEl.className = "overlay";
  overlayEl.innerHTML = `<div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(overlayEl);
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => overlayEl && overlayEl.classList.add("open"));
  const f = overlayEl.querySelector("[autofocus], .sheet-b input, .sheet-b button, .sheet-f .btn-primary");
  // (para entonces la hoja pudo haberse cerrado o cambiado de contenido: se enfoca solo lo que siga estando)
  setTimeout(() => { const foco = f && document.contains(f) ? f : overlayEl && overlayEl.querySelector(".sheet"); if (foco) foco.focus?.(); }, 60);
  overlayEl.addEventListener("mousedown", (e) => { if (e.target === overlayEl) closeSheet(); });
}
function closeSheet(instant = false) {
  if (!overlayEl) return;
  const el = overlayEl; overlayEl = null;
  document.body.style.overflow = "";
  if (instant) el.remove(); else { el.classList.remove("open"); setTimeout(() => el.remove(), 260); } // 260 ms: lo que tarda la hoja en bajar en el celular
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus?.();
}
const sheetHead = (title, sub = "") => `<div class="sheet-h"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div><button class="iconbtn x" data-action="close-sheet" aria-label="Cerrar">${ic("x")}</button></div>`;

/* ---------- Flujo de reserva (3 pasos) ---------- */
let draft = null;
function startBooking(boxId, date, start, end) {
  const u = me();
  if (u.status !== "aprobado") { toast("Solo las profesionales aprobadas pueden reservar."); return; } // RN01
  if (!canBook(boxId, date, start, end)) { toast("Ese horario ya no está disponible."); render(); return; }
  const sd = saldos(u);
  if (sd.bloqueado) { toast(MENSAJES.saldo_vencido); go("mis"); return; }
  draft = { boxId, date, start, end, step: 1, service: "", plan: sd.soloTotal ? "total" : "sena", accepted: false, machines: [] };
  renderBookingSheet();
}
function draftBox() { return priceFor(draft.end - draft.start, me(), draft.boxId); }
function draftMachines() { const h = draft.end - draft.start; return draft.machines.map(machineById).filter(Boolean).map(m => machineLine(m, h)); }
function draftTotal() { return draftBox() + draftMachines().reduce((a, m) => a + m.amount, 0); }
function draftAmount() { return draft.plan === "sena" ? senaOf(draftTotal()) : draftTotal(); }
function renderBookingSheet(keepScroll = false) {
  const d = draft, box = boxById(d.boxId), total = draftTotal(), c = S.config, p = c.policy, hrs = d.end - d.start, ml = draftMachines();
  const isRel = releasesFor(d.date, d.boxId).some(r => r.start <= d.start && r.end >= d.end);
  const steps = ["Turno", "Pago", "Reglamento"].map((s, i) => `<span class="${i + 1 === d.step ? "on" : i + 1 < d.step ? "done" : ""}">${s}</span>`).join("");
  const summary = `<div class="summary"><b>${esc(box.name)}${isRel ? " · rato libre" : ""}</b><b class="r num">${money(total)}</b><span class="muted">${cap(fmtDay(d.date))}</span><span class="muted r num">${fmtRange(d.start, d.end)}</span>
    <span class="muted">Box: ${hrs} h a ${money(rateOf(me(), box))}</span><span class="muted r num">${money(draftBox())}</span>${ml.map(m => `<span class="muted">${esc(m.name)}: ${m.hours} h a ${money(m.rate)}</span><span class="muted r num">${money(m.amount)}</span>`).join("")}</div>`;
  const avail = S.machines.filter(m => m.active);
  const mach = !avail.length ? "" : `<div class="group-l">¿Sumás una máquina?</div>
      ${avail.map(m => { const busy = machineBusy(m.id, d.date, d.start, d.end);
        return `<label class="choice ${busy ? "is-off" : ""}"><input type="checkbox" data-draft-machine="${m.id}" ${d.machines.includes(m.id) ? "checked" : ""} ${busy ? "disabled" : ""}><div><div class="ct">${esc(m.name)}</div><div class="cs">${busy ? "Ya está reservada en este horario" : esc(m.short || "")}</div></div><span class="camt num">${busy ? "" : "+ " + money(m.pricePerHour * hrs)}</span></label>`; }).join("")}
      <p class="muted small">Las máquinas se cobran por hora, por las ${hrs} h del turno.</p>`;
  let body = "", foot = "";
  if (d.step === 1) {
    body = `
      <div class="group-l">Qué tiene el box</div>
      <ul class="eq" style="margin-bottom:6px">${box.equipment.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
      ${mach}
      <div class="field" style="margin-top:18px"><label for="svc">¿Qué vas a atender?</label><input class="input" id="svc" data-draft="service" value="${esc(d.service)}" placeholder="Ej.: Dermatología"><span class="hint">Solo lo ve ${OW()}. Las demás profesionales ven este horario como “Ocupado”.</span></div>`;
    foot = `<button class="btn" data-action="close-sheet">Cancelar</button><button class="btn btn-primary" data-action="draft-next">Continuar</button>`;
  } else if (d.step === 2) {
    const sena = senaOf(total), sd = saldos();
    if (sd.soloTotal) d.plan = "total";
    body = `
      <div class="group-l">¿Cuánto pagás ahora?</div>
      <label class="choice ${sd.soloTotal ? "is-off" : ""}"><input type="radio" name="plan" value="sena" data-draft="plan" ${d.plan === "sena" ? "checked" : ""} ${sd.soloTotal ? "disabled" : ""}><div><div class="ct">Seña del ${c.depositPct} %</div><div class="cs">${sd.soloTotal ? `Ya tenés ${sd.n} ${sd.n === 1 ? "turno" : "turnos"} con saldo pendiente: este va completo, o pagá antes un saldo` : `El resto (${money(total - sena)}) lo pagás antes del turno`}</div></div><span class="camt num">${money(sena)}</span></label>
      <label class="choice"><input type="radio" name="plan" value="total" data-draft="plan" ${d.plan === "total" ? "checked" : ""}><div><div class="ct">Total</div><div class="cs">Y te olvidás del saldo</div></div><span class="camt num">${money(total)}</span></label>
      <div class="group-l">Cómo se paga</div>
      ${payLine()}
      <div class="note">Si cancelás con ${p.days} días o más, te devolvemos el ${d.plan === "sena" ? p.senaBefore : p.totalBefore} %. Con menos, ${d.plan === "sena" ? (p.senaAfter ? `el ${p.senaAfter} %` : "la seña no se devuelve") : `el ${p.totalAfter} %`}.</div>`;
    foot = `<button class="btn" data-action="draft-back">Atrás</button><button class="btn btn-primary" data-action="draft-next">Continuar</button>`;
  } else {
    d.termsVersion = c.terms.version;      // la versión que se le está mostrando: esa es la que acepta
    body = `
      <div class="group-l">Reglamento de uso del consultorio <span class="muted" style="font-weight:400">· versión ${c.terms.version}</span></div>
      <div class="terms"><ol>${c.terms.text.split("\n").filter(Boolean).map(l => `<li>${esc(l)}</li>`).join("")}</ol></div>
      <label class="check" style="margin-top:14px"><input type="checkbox" data-draft="accepted" ${d.accepted ? "checked" : ""}><span>Leí y acepto el reglamento de uso y la política de cancelación.</span></label>
      <div class="note acc">Vas a pagar <b class="num">${money(draftAmount())}</b> ${d.plan === "sena" ? "de seña" : ""}. Tenés ${c.mpMinutes} minutos para completar el pago.</div>`;
    foot = `<button class="btn" data-action="draft-back">Atrás</button><button class="btn btn-primary" data-action="draft-confirm" ${d.accepted ? "" : "disabled"} id="confirmBtn">Ir a pagar ${money(draftAmount())}</button>`;
  }
  openSheet(`${sheetHead("Reservar " + esc(box.name), "Paso " + d.step + " de 3")}<div class="sheet-b"><div class="steps">${steps}</div>${summary}${body}</div><div class="sheet-f">${foot}</div>`);
}

async function confirmDraft() {
  const d = draft;
  if (!d.accepted) { toast("Tenés que aceptar el reglamento para reservar."); return; } // RN05
  const r = await accion("reservar", { p_box: d.boxId, p_fecha: d.date, p_desde: d.start, p_hasta: d.end, p_servicio: d.service.trim(), p_plan: d.plan,
    p_maquinas: d.machines, p_reglamento_version: d.termsVersion });
  if (!r) {
    if (ultimoError === "maquina_no_disponible") {            // alguien se llevó la máquina mientras se completaba la reserva
      d.machines = d.machines.filter(id => machineById(id) && machineById(id).active && !machineBusy(id, d.date, d.start, d.end));
      d.step = 1; renderBookingSheet(); return;
    }
    if (ultimoError === "reglamento_cambio") { d.accepted = false; d.step = 3; renderBookingSheet(); return; }
    if (ultimoError === "demasiados_saldos") { d.plan = "total"; d.step = 2; renderBookingSheet(); return; }
    if (ultimoError === "sin_conexion") return;                // la hoja queda abierta para reintentar
    draft = null; closeSheet(); render(); return;
  }
  draft = null;
  render();
  const b = findB(r.id);
  if (!b) { closeSheet(); return; }
  if (b.status === "pago") openMp(b, b.plan);
  else showSuccess(b, "¡Reserva confirmada!", "No había nada para pagar.");
}

/* ---------- El pago (RF13, RN08): Mercado Pago o, mientras no esté conectado, un pago de prueba ---------- */
const amountOf = (b, kind) => kind === "saldo" ? balanceOf(b) : kind === "sena" ? depositOf(b) : b.total;
function openMp(b, kind) {
  const amount = amountOf(b, kind);
  const resumen = `<div class="mp-head"><div class="mp-logo">MP</div><div><b>${SITE()}</b><div class="muted small">${KIND[kind]} · ${esc(boxById(b.boxId).name)}, ${fmtDayShort(b.date)} ${fmtRange(b.start, b.end)}</div></div></div>
    <div class="amount num">${money(amount)}</div>
    ${b.status === "pago" ? `<p class="muted" style="margin-top:6px">Tu turno queda guardado <span class="timer" data-countdown="${b.expiresAt}"></span>. Si no se paga, se libera solo.</p>` : ""}`;
  if (S.site.payments !== "simulado") {
    if (!(S.site.mp && S.site.mp.ready)) {
      openSheet(`${sheetHead("Pagar con Mercado Pago")}
      <div class="sheet-b">${resumen}<div class="note warn">Por ahora el consultorio no puede cobrar con Mercado Pago. Avisale a ${OW()} para coordinar el pago.</div></div>
      <div class="sheet-f"><button class="btn" data-action="close-sheet">Cerrar</button></div>`);
    } else {
      openSheet(`${sheetHead("Pagar con Mercado Pago", mpDePrueba() ? "Modo prueba: no se cobra plata de verdad" : "")}
      <div class="sheet-b">${resumen}
        <p class="muted" style="margin-top:10px">Te llevamos a Mercado Pago para pagar con tarjeta o con dinero en cuenta. Al terminar volvés acá y la reserva queda confirmada.</p>
        ${mpDePrueba() ? `<div class="note acc">Modo prueba de Mercado Pago: usá una tarjeta de prueba. No se cobra plata de verdad. Pagá sin entrar a tu cuenta de Mercado Pago (mejor en una ventana de incógnito) y, si te pide un mail, poné <b>test@testuser.com</b>: con otro no anda.</div>` : ""}
      </div>
      <div class="sheet-f"><button class="btn" data-action="close-sheet">Ahora no</button><button class="btn btn-primary" data-action="mp-ir" data-id="${b.id}" data-kind="${kind}">Ir a pagar ${money(amount)}</button></div>`);
    }
  } else {
    openSheet(`${sheetHead("Pagar", "Modo de prueba: el pago es simulado, no se cobra plata de verdad")}
    <div class="sheet-b">${resumen}</div>
    <div class="sheet-f"><button class="btn" data-action="close-sheet">Ahora no</button><button class="btn btn-primary" data-action="mp-approve" data-id="${b.id}" data-kind="${kind}">Pagar ${money(amount)}</button></div>`);
  }
  tick();
}
async function mpApprove(id, kind) {
  const r = await accion("simular_pago", { p_reserva: id, p_tipo: kind });
  render();
  const b = findB(id);
  if (!r || !b) { if (ultimoError !== "sin_conexion") closeSheet(); return; }
  showSuccess(b, kind === "saldo" ? "¡Listo! Pagaste el saldo" : "¡Reserva confirmada!", kind === "saldo" ? "Tu turno está pago completo." : "Te vamos a recordar el turno el día anterior.");
}

/* Pagar de verdad: el servidor crea el cobro en Mercado Pago y devuelve a dónde ir a pagarlo */
const esperar = (ms) => new Promise((listo) => setTimeout(listo, ms));
async function mpIr(id, kind) {
  let r = await accionFuncion("mp", { accion: "pagar", reserva: id, tipo: kind });
  if (!r && ultimoError === "pago_en_curso") { await esperar(3000); r = await accionFuncion("mp", { accion: "pagar", reserva: id, tipo: kind }); }
  if (!r) { if (ultimoError !== "sin_conexion" && !["mp_rechazo", "mp_sin_respuesta", "pago_en_curso"].includes(ultimoError)) { closeSheet(); render(); } return; }
  if (!esDeMercadoPago(r.enlace)) { toast("No pudimos abrir Mercado Pago. Probá de nuevo en un momento."); return; }
  document.body.classList.add("is-busy");           // se va de la página: que no se pueda tocar nada más
  location.assign(r.enlace);
}

/* Volvió de Mercado Pago después de pagar (o de no pagar). Se le pregunta al servidor cómo quedó ese pago: si recién
   pagó, la confirmación de Mercado Pago puede tardar unos segundos, así que se pregunta varias veces. */
async function atenderVueltaDeMp() {
  const v = vueltaDeMp;
  if (!v || fase !== "lista") return;
  if (!servidor.sesion) return;                       // todavía no entró: se atiende cuando entre
  vueltaDeMp = null;
  if (v.conexion) return atenderConexionDeMp(v.conexion);
  if (!v.pago) { if (v.dijo !== "ok") toast("No se hizo ningún pago."); return; }
  openSheet(`${sheetHead("Volviste de Mercado Pago")}<div class="sheet-b"><div class="success"><div class="spinner" aria-hidden="true"></div><h3>Estamos confirmando tu pago…</h3><p>Tarda unos segundos. No cierres esta página.</p></div></div>`);
  let res = null;
  for (let i = 0; i < 8; i++) {
    try { res = await servidor.funcion("mp", { accion: "verificar", pago: v.pago }); }
    catch (e) { res = null; if (e.code !== "sin_conexion") break; }
    if (res && (res.estado !== "pendiente" || v.dijo !== "ok")) break;
    await esperar(2500);
  }
  try { await cargar(); } catch (e) { ultimaCarga = 0; }
  render();
  const b = res && findB(res.reserva);
  const cerrar = `<div class="sheet-f"><button class="btn" data-action="close-sheet">Cerrar</button><button class="btn btn-primary" data-action="go-mis">Ver mis reservas</button></div>`;
  const cartel = (titulo, texto, pie) => openSheet(`${sheetHead("")}<div class="sheet-b"><div class="success"><h3>${titulo}</h3><p>${texto}</p></div></div>${pie || cerrar}`);
  if (res && res.estado === "aprobado" && b) {
    const saldo = b.payments.length > 1 && !balanceOf(b);
    return showSuccess(b, saldo ? "¡Listo! Pagaste el saldo" : "¡Reserva confirmada!", saldo ? "Tu turno está pago completo." : "Te vamos a recordar el turno el día anterior.");
  }
  if (res && (res.estado === "sobrante" || res.estado === "devuelto")) {
    return cartel("Te devolvemos ese pago", "El pago llegó cuando el turno ya no estaba disponible, o ya estaba hecho. Te lo devolvemos entero por el mismo medio con el que pagaste; puede tardar unos días. No tenés que hacer nada.");
  }
  if (res && res.estado === "revisar") return cartel("Tu pago quedó para revisar", `Algo no coincidió con lo que esperábamos de Mercado Pago. Avisale a ${OW()}: tu plata no se pierde.`);
  // no se pudo preguntar (sin conexión, o el servidor no contestó), o Mercado Pago todavía no lo confirmó: no se afirma nada
  if (!res || (res.estado === "pendiente" && v.dijo === "ok")) {
    return cartel(res ? "Todavía no nos llegó la confirmación" : "No pudimos confirmar tu pago ahora", "Si pagaste, en unos minutos tu reserva va a aparecer confirmada sola y te va a llegar un mail. No pagues de nuevo.");
  }
  // no pagó, la tarjeta fue rechazada o el plazo venció
  const sigue = b && (b.status === "pago" || (["confirmada", "cumplida"].includes(b.status) && balanceOf(b)));
  cartel("El pago no se hizo", res && res.estado === "rechazado" ? "Mercado Pago rechazó el pago. Podés probar con otro medio de pago." : "No se cobró nada.",
    sigue ? `<div class="sheet-f"><button class="btn" data-action="close-sheet">Ahora no</button><button class="btn btn-primary" data-action="${b.status === "pago" ? "pay-now" : "pay-balance"}" data-id="${b.id}">Intentar de nuevo</button></div>` : cerrar);
}

/* Pide que salgan ya las devoluciones que esperan. No frena a la persona: si no sale ahora, la hace el reloj del servidor. */
function despacharMp() {
  servidor.funcion("mp", { accion: "despachar" })
    .then(() => cargar()).then(() => { if (puedeDibujar()) render(); else pendienteDeDibujar = true; })
    .catch(() => { /* la hace el reloj */ });
}

/* Volvió de Mercado Pago después de autorizar (o no) la cuenta del consultorio */
const MOTIVOS_MP = {
  cancelado: "No se conectó ninguna cuenta: en Mercado Pago elegiste no autorizar.",
  pais: "Esa cuenta de Mercado Pago no es de Argentina. Conectá una cuenta argentina.",
  ambiente: "Esa cuenta es de prueba y este consultorio cobra de verdad. Conectá la cuenta real.",

/* Achica la foto elegida (lado mayor de 1100 px) y la devuelve lista para guardar */
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) { reject(new Error("no es una imagen")); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1100 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("no se pudo leer")); };
    img.src = url;
  });
}

    ${bloque("Facturadas", r.emitidas.map(x => filaHoja(nombre(x.userId), `Número ${pad8(x.numero)} · CAE ${esc(x.cae || "")}`)))}
    ${bloque("Rechazadas por ARCA", r.rechazadas.map(x => filaHoja(nombre(x.userId), esc(x.motivo))))}
    ${bloque("En duda", r.inciertas.map(x => filaHoja(nombre(x.userId), "Apretá «Facturar todo el mes» de nuevo en unos minutos: se revisa sola, sin duplicarla.")))}
    ${bloque("Para revisar a mano", r.revisar.map(x => filaHoja(nombre(x.userId), "Avisale a Entreturno.")))}
    ${bloque("Les faltan datos", r.faltan.map(x => filaHoja(nombre(x.userId), x.missing === "cuit" ? "Falta la CUIT" : "Falta la condición frente al IVA")))}
    ${bloque("Quedaron para la próxima", (r.sinIntentar || []).map(x => filaHoja(nombre(x.userId), esc(x.motivo))))}
    ${nada && !(r.sinIntentar || []).length ? `<p class="muted">No había nada para facturar.</p>` : ""}
  </div><div class="sheet-f"><button class="btn btn-primary" data-action="close-sheet">Listo</button></div>`);
}

function openProbarResultado(r) {
  let cuerpo;
  if (r.ambiente === "apagado") cuerpo = `<p>La facturación con ARCA todavía no está prendida para tu consultorio.</p>`;
  else if (!r.ok) cuerpo = `<div class="note">${esc(textoErrorArca(r.error || { codigo: "falla" }))}</div>`;
  else {
    const falta = r.ambiente === "real" && Array.isArray(r.puntosVenta) && !r.puntosVenta.includes(r.puntoVenta);
    cuerpo = `<ul class="list">${filaHoja("ARCA responde", "Los servidores de facturación están en orden")}
      ${filaHoja("Acceso con el certificado de Entreturno", `Vigente hasta el ${fmtWhen(Date.parse(r.ticketVence))}`)}
      ${filaHoja(`Punto de venta ${pad4(r.puntoVenta)}`, `Último número emitido: ${r.ultimoNumero}`)}</ul>
      ${falta ? `<div class="note" style="margin-top:12px">ARCA no tiene el punto de venta ${pad4(r.puntoVenta)} para web services con tu CUIT. Revisá el número.</div>` : ""}`;
  }
  openSheet(`${sheetHead("Conexión con ARCA", r.ambiente === "prueba" ? "Modo prueba" : r.ambiente === "real" ? "Facturación real" : "")}
  <div class="sheet-b">${cuerpo}</div><div class="sheet-f"><button class="btn btn-primary" data-action="close-sheet">Listo</button></div>`);
}

function openFiscalSheet(u) {
  openSheet(`${sheetHead("Datos para la factura", esc(u.name))}
  <form data-form="user-fiscal" data-id="${u.id}"><div class="sheet-b">
    <div class="field"><label for="uc">CUIT</label><input class="input" id="uc" name="cuit" inputmode="numeric" maxlength="13" placeholder="27-12345678-9" value="${esc(u.cuit || "")}" required></div>
    <div class="field"><label for="ui">Condición frente al IVA</label><select class="input" id="ui" name="ivaCond" required><option value="">Elegí una</option>${CONDICIONES_IVA.map(([v, n]) => `<option value="${v}" ${u.ivaCond === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <p class="hint">Van en su factura del mes. Si no los sabe, están en su constancia de inscripción de ARCA.</p>
  </div><div class="sheet-f"><button class="btn" type="button" data-action="close-sheet">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div></form>`);
}

/* =========================================================
   Eventos
   ========================================================= */
function go(view) { closeSheet(true); S.ui.view = view; render(); window.scrollTo(0, 0); }
/* Al pasar de paso en la reserva, el contenido entra desde el lado hacia donde se avanza */
function stepFx(dir) {
  const el = overlayEl?.querySelector(".sheet-b");
  if (!el || !el.animate) return;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.animate([{ opacity: 0, transform: calm ? "none" : `translateX(${dir * 10}px)` }, { opacity: 1, transform: "none" }], { duration: 220, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
}
const findB = (id) => S.bookings.find(b => b.id === id);

document.addEventListener("click", async (e) => {
  const navEl = e.target.closest("[data-nav]");
  if (navEl) {
    e.preventDefault();
    const v = navEl.dataset.nav;
    if (v === "__more") {
      openSheet(`${sheetHead("Más opciones")}<div class="sheet-b"><nav class="nav">${navFor(me()).slice(4).map(n => `<a href="#${n.id}" data-nav="${n.id}" style="height:48px">${ic(n.icon)}<span>${n.label}</span>${n.badge ? `<span class="badge num">${n.badge}</span>` : ""}</a>`).join("")}</nav></div>`);
      return;
    }
    go(v); return;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, ds = el.dataset;
  switch (a) {
    case "close-sheet": closeSheet(); if (pendienteDeDibujar && fase === "lista") render(); break;
    case "toggle-theme": toggleTheme(); break;
    case "reintentar": iniciar(); break;
    case "logout":
      closeSheet(true);
      $("#toast").classList.remove("show");      // que no quede a la vista un aviso de la cuenta anterior
      await servidor.salir();
      eligiendoClave = false; pasoDeIngreso = null;
      S.ui.view = null; S.ui.calPicked = false;
      try { await cargar(); } catch (err) { fase = "error"; errorDeArranque = mensajeDe(err); }
      render(); window.scrollTo(0, 0); break;
    case "auth-tab": pasoDeIngreso = null; S.ui.authTab = ds.tab; render(); break;
    case "auth-paso": pasoDeIngreso = { tipo: ds.tipo }; render(); window.scrollTo(0, 0); break;
    case "reenviar-mail":
      if (pasoDeIngreso && pasoDeIngreso.mail && await intentar(() => servidor.reenviar(pasoDeIngreso.mail, VOLVER))) toast("Listo, te lo mandamos de nuevo.");
      break;
    case "clave-despues": eligiendoClave = false; render(); window.scrollTo(0, 0); await despuesDeEntrar(false); break;
    case "enlace-usar": enlaceDeLlegada = enlaceEnEspera; enlaceEnEspera = null; usarEnlaceIgual = true; await iniciar(); break;
    case "enlace-descartar": enlaceEnEspera = null; render(); window.scrollTo(0, 0); break;
    case "tab": S.ui.tab[ds.k] = ds.v; render(); break;
    case "cal-day": S.ui.calDate = ds.date; S.ui.calPicked = true; fx = "cal"; render(); break;
    case "cal-today": S.ui.calDate = todayIso(); fx = "cal"; render(); break;
    case "cal-week": S.ui.calDate = addDays(mondayOf(S.ui.calDate), 7 * Number(ds.dir)); fx = "cal"; render(); break;
    case "go-agenda-today": S.ui.calDate = todayIso(); go("agenda"); break;
    case "ag-view": S.ui.agView = ds.v; fx = "cal"; render(); break;
    case "ag-day": S.ui.calDate = ds.date; S.ui.agView = "dia"; S.ui.calPicked = true; fx = "cal"; render(); window.scrollTo(0, 0); break;
    case "ag-move": {
      const v = agView(), dir = +ds.dir;
      if (v === "mes") S.ui.calDate = ymAdd(ymOf(S.ui.calDate), dir) + "-01";
      else S.ui.calDate = addDays(v === "semana" ? mondayOf(S.ui.calDate) : S.ui.calDate, dir * (v === "semana" ? 7 : agDays()));
      fx = "cal"; render(); break;
    }
    case "go-mis": S.ui.tab.mis = "proximas"; go("mis"); break;
    case "book": startBooking(+ds.box, ds.date, +ds.start, +ds.end); break;
    case "draft-next":
      if (draft.step === 1) draft.service = ($("#svc")?.value || "").trim();
      draft.step++; renderBookingSheet(); stepFx(1); break;
    case "draft-back": draft.step--; renderBookingSheet(); stepFx(-1); break;
    case "draft-confirm": await confirmDraft(); break;
    case "my-booking": { const b = findB(ds.id); S.ui.tab.mis = (b.status === "cumplida" && !balanceOf(b)) || b.status === "cancelada" ? "historial" : "proximas"; go("mis"); break; }
    case "pay-now": { const b = findB(ds.id); if (b) openMp(b, b.plan); break; }
    case "pay-balance": { const b = findB(ds.id); if (b) openMp(b, "saldo"); break; }
    case "mp-approve": await mpApprove(ds.id, ds.kind); break;
    case "mp-ir": await mpIr(ds.id, ds.kind); break;
    case "cancel": openCancel(findB(ds.id), "pro"); break;
    case "admin-cancel": openCancel(findB(ds.id), "admin"); break;
    case "confirm-cancel": {
      const r = await accion("cancelar_reserva", { p_reserva: ds.id });
      if (!r && ultimoError === "sin_conexion") break;
      closeSheet(); render();
      if (r) toast(r.amount ? `Reserva cancelada. Devolución: ${money(r.amount)}.` : "Reserva cancelada. El horario quedó libre.");
      // con Mercado Pago, la devolución (y cerrar el cobro que haya quedado abierto) sale ya, sin esperar al reloj del servidor
      if (r && S.site.payments === "mercadopago") despacharMp();
      break;
    }
    // Mercado Pago: la cuenta del consultorio (administradora)
    case "mp-conectar": {
      const r = await accionFuncion("mp", { accion: "conectar" });
      if (!r) break;
      if (!/^https:\/\/auth\.mercadopago\.com\//.test(String(r.url)) && !esDeMercadoPago(r.url)) { toast("No pudimos abrir Mercado Pago. Probá de nuevo en un momento."); break; }
      document.body.classList.add("is-busy");
      location.assign(r.url);
      break;
    }
    case "mp-revisar": openMpConfirm(); break;
    case "mp-confirmar": {
      const r = await accion("mp_conexion_confirmar", { p_user_id: ds.cuenta });     // la cuenta que vio en la hoja, no «la que haya»
      closeSheet(); render();
      if (r) toast(S.site.payments === "mercadopago" ? "Cuenta confirmada. Ya se puede cobrar con Mercado Pago." : "Cuenta confirmada. Entreturno prende el cobro de verdad cuando esté todo probado.");
      break;
    }
    case "mp-quitar": {
      const a = S.config.mp && S.config.mp.account;
      openSheet(`${sheetHead("¿Quitar la cuenta de Mercado Pago?")}
      <div class="sheet-b"><p>${a && a.status === "conectada" && S.site.payments === "mercadopago" ? "Mientras no haya una cuenta conectada <b>no se van a poder cobrar reservas ni hacer devoluciones</b>." : "Después podés conectar otra cuenta."}</p>
        <p class="muted" style="margin-top:8px">Para quitarle del todo el permiso a Entreturno, hacelo también desde tu cuenta de Mercado Pago.</p></div>
      <div class="sheet-f"><button class="btn" data-action="close-sheet">Dejarla</button><button class="btn btn-danger" data-action="mp-quitar-ok">Quitar la cuenta</button></div>`);
      break;
    }
    case "mp-quitar-ok": {
      const r = await accion("mp_desconectar", {});
      closeSheet(); render();
      if (r) toast("La cuenta de Mercado Pago quedó desconectada.");
      break;
    }
    case "mp-a-mano": {
      const b = S.bookings.find(x => x.payments.some(p => p.id === ds.id) || (x.surplus || []).some(p => p.id === ds.id));
      const p = b && (b.payments.find(x => x.id === ds.id) || b.surplus.find(x => x.id === ds.id));
      if (p) openDevolucionAMano(ds.id, p.amount, userById(b.userId).name);
      break;
    }
    case "mp-a-mano-ok": {
      const r = await accion("mp_devolucion_a_mano", { p_devolucion: ds.id });
      closeSheet(); render();
      if (r) toast("Listo: quedó anotada como devuelta.");
      break;
    }
    case "mp-despachar": {
      const r = await accionFuncion("mp", { accion: "despachar" });
      render();
      if (r) toast(r.fallas ? "Alguna devolución todavía no pudo salir. El sistema lo sigue intentando." : "Listo: las devoluciones salieron.");
      break;
    }
    // Administradora
    case "adm-free": openBlockSheet(+ds.box, ds.date, +ds.start, +ds.end); break;
    case "adm-new-block": openBlockSheet(null, S.ui.calDate < todayIso() ? todayIso() : S.ui.calDate); break;
    case "adm-block": { const bl = S.blocks.find(x => x.id === ds.id); if (bl) openBlockedSheet(bl, +ds.box, ds.date); break; }
    case "adm-release": {
      const rl = S.releases.find(x => x.id === ds.id);
      if (!rl) break;
      openSheet(`${sheetHead("Rato libre publicado", `${esc(boxById(rl.boxId).name)} · ${cap(fmtDay(rl.date))} · ${fmtRange(rl.start, rl.end)}`)}
        <div class="sheet-b"><p>Las profesionales aprobadas lo ven como “Rato libre” y lo pueden reservar, cada una al precio por hora que le corresponde.</p></div>
        <div class="sheet-f"><button class="btn" data-action="close-sheet">Cerrar</button><button class="btn btn-dark" data-action="delete-release" data-id="${rl.id}">Volver a bloquearlo</button></div>`);
      break;
    }
    case "delete-release": { const r = await accion("quitar_rato", { p_rato: ds.id }); closeSheet(); render(); if (r) toast("El horario volvió a quedar bloqueado."); break; }
    case "unblock-day": { const r = await accion("liberar_dia", { p_bloqueo: ds.block, p_box: +ds.box, p_fecha: ds.date }); closeSheet(); render(); if (r) toast("Liberaste ese día completo para alquilar."); break; }
    case "delete-block": { const r = await accion("quitar_bloqueo", { p_bloqueo: ds.block }); closeSheet(); render(); if (r) toast("Bloqueo quitado."); break; }
    case "adm-booking": { const b = findB(ds.id); if (b) openAdminBooking(b); break; }
    case "user-status": {

      const r = await accion("cambiar_estado_profesional", { p_miembro: ds.id, p_estado: ds.s });

      if (r) toast({ aprobado: `${nombre} ya puede reservar.`, rechazado: "Solicitud rechazada.", bloqueado: `Pausaste el acceso de ${nombre}.` }[ds.s]);
      break;
    }
    // Ajustes: categorías y máquinas
    case "cat-add": openCatSheet(null); break;

    case "machine-edit": openMachineSheet(machineById(ds.id)); break;
