/* Varios días seguidos, uno debajo del otro, cada uno con sus tres boxes */
function agendaList(start, n) {
  const t = todayIso(), end = addDays(start, n - 1), a = fromIso(start), b = fromIso(end);
  const label = n === 1 ? cap(fmtDay(start)) : a.getMonth() === b.getMonth()
    ? `${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}` : `${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]}`;
  const slot = (s, box, d) => {
    const who = s.kind === "booking" ? esc(userById(s.ref.userId).name) : s.kind === "block" ? esc(s.ref.note || "Lo usás vos") : s.kind === "release" ? "Rato libre publicado" : s.past ? "Sin alquilar" : "Libre";
    const kind = s.kind === "booking" ? "busy" : s.kind === "block" ? "block" : s.kind === "release" ? "rel" : s.past ? "gone" : "free";
    const data = `data-box="${box.id}" data-date="${d}" data-start="${s.start}" data-end="${s.end}"`;
    const act = s.kind === "booking" ? `data-action="adm-booking" data-id="${s.ref.id}"` : s.kind === "block" ? `data-action="adm-block" data-id="${s.ref.id}" ${data}`
      : s.kind === "release" ? `data-action="adm-release" data-id="${s.ref.id}" ${data}` : s.past ? "" : `data-action="adm-free" ${data}`;
    return `<li class="slot slot-${kind} ${act ? "click" : ""}" ${act} ${act ? 'tabindex="0" role="button"' : ""}><span class="hr num">${fmtRange(s.start, s.end)}</span><span class="who">${who}</span></li>`;
  };
  const days = Array.from({ length: n }, (_, i) => addDays(start, i));
  return `${agHead(label, "Días anteriores", "Días siguientes")}
  <div class="aglist ${fx === "cal" ? "fx-in" : ""}">${days.map(d => {
    const open = S.config.days.includes(weekday(d));
    const nb = S.bookings.filter(x => x.date === d && active(x)).length;
    return `<section class="panel agday ${d < t ? "past" : ""}">
      <div class="panel-h"><h2>${cap(fmtDay(d))}${d === t ? ' <span class="pill pill-neutral">Hoy</span>' : ""}</h2>
        ${open ? `<button class="btn btn-text btn-sm" data-action="ag-day" data-date="${d}">${nb} ${nb === 1 ? "reserva" : "reservas"} · ver el día</button>` : `<span class="muted small">Cerrado</span>`}</div>
      <div class="panel-b">${open ? `<div class="today-cols">${S.boxes.map(box => `<div><div class="cal-boxh"><span class="plate num" aria-hidden="true">${box.id}</span><div class="bx-txt"><b>${esc(box.name)}</b></div></div><ul class="slots">${segments(d, box.id).filter(s => s.kind !== "gap").map(s => slot(s, box, d)).join("")}</ul></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">El consultorio no abre los ${DIAS[weekday(d)]}.</p>`}</div>
    </section>`; }).join("")}</div>`;
}

/* El mes entero: cada día con sus reservas y cuánto está alquilado. Tocar un día lo abre. */
function agendaMonth() {
  const t = todayIso(), ym = ymOf(S.ui.calDate), [y, m] = ym.split("-").map(Number);
  const nDays = new Date(y, m, 0).getDate(), lead = (weekday(ym + "-01") + 6) % 7; // la semana empieza el lunes
  const cells = Array.from({ length: lead }, () => `<div class="mday out"></div>`);
  for (let n = 1; n <= nDays; n++) {
    const d = `${ym}-${pad(n)}`, open = S.config.days.includes(weekday(d));
    let booked = 0, rentable = 0;
    if (open) S.boxes.forEach(b => segments(d, b.id).forEach(s => { const h = s.end - s.start; if (s.kind === "booking") { booked += h; rentable += h; } else if (s.kind === "free" || s.kind === "release") rentable += h; }));
    const nb = S.bookings.filter(x => x.date === d && active(x)).length, pct = rentable ? Math.round(booked / rentable * 100) : 0;
    cells.push(`<button class="mday ${open ? "" : "closed"} ${d < t ? "past" : ""} ${d === t ? "is-today" : ""}" data-action="ag-day" data-date="${d}" aria-label="${cap(fmtDay(d))}: ${open ? nb + (nb === 1 ? " reserva" : " reservas") : "cerrado"}">
      <span class="dn num">${n}</span>
      ${open ? `<span class="mr num">${nb ? nb + (nb === 1 ? " reserva" : " reservas") : "Sin reservas"}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="mp num">${pct} % alquilado</span>` : `<span class="mr">Cerrado</span>`}
    </button>`);
  }
  return `${agHead(cap(ymLabel(ym)), "Mes anterior", "Mes siguiente")}
  <section class="panel month ${fx === "cal" ? "fx-in" : ""}"><div class="mhead">${["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(x => `<span>${x}</span>`).join("")}</div><div class="mgrid">${cells.join("")}</div></section>`;
}

function viewAgenda() {
  const v = agView();
  const body = v === "mes" ? agendaMonth() : v === "semana" ? agendaList(mondayOf(S.ui.calDate), 7) : v === "dias" ? agendaList(S.ui.calDate, agDays()) : calendar("admin");
  return `
  <div class="title-row"><div>
    <h1>Agenda</h1>
    <p class="sub">${v === "dia" ? "Tocá un horario para bloquearlo, liberar un rato o ver una reserva." : "Vela como te quede cómodo: por día, por semana, por mes o la cantidad de días que elijas."}</p>
  </div><button class="btn" data-action="adm-new-block">Bloquear horarios</button></div>
  ${agendaSwitch()}
  ${body}`;
}

    <thead><tr><th>Profesional</th><th>Turno</th><th>Box</th><th>Estado</th><th>Pago</th><th class="num">Cobrado</th><th class="num">Total</th></tr></thead>
    <tbody>${rows.map(b => { const u = userById(b.userId); return `<tr class="click" data-action="adm-booking" data-id="${b.id}" tabindex="0">
      <td><div class="t">${esc(u.name)}</div><div class="s">${esc(b.service || u.profession)}</div></td>

      <td>${esc(boxById(b.boxId).name)}${machinesOf(b).length ? `<div class="s">con ${machinesOf(b).map(m => esc(m.name)).join(", ")}</div>` : ""}</td>
      <td>${statusPill(b)}</td>

      <td class="num">${money(paidOf(b))}</td><td class="num">${money(b.total)}</td></tr>`; }).join("")}</tbody>
  </table></div>
  <div class="mrows">${rows.map(b => { const u = userById(b.userId); return `<button class="mrow" data-action="adm-booking" data-id="${b.id}">
    <div class="main"><div class="l1"><span>${esc(u.name)}</span><span class="num">${money(paidOf(b))} / ${money(b.total)}</span></div>
    <div class="l2 num">${fmtDayShort(b.date)} · ${fmtRange(b.start, b.end)} · ${esc(boxById(b.boxId).name)}${machinesOf(b).length ? " con " + machinesOf(b).map(m => esc(m.name)).join(", ") : ""}</div><div style="margin-top:6px">${statusPill(b)}</div></div>${ic("chevR")}</button>`; }).join("")}</div>
  ` : `<div class="panel"><div class="empty"><b>No hay reservas con estos filtros</b>Probá con otra pestaña o borrá la búsqueda.</div></div>`}`;

function viewFacturacion() {
  const nowYm = ymOf(todayIso()), ym = S.ui.invYm || nowYm, bl = S.config.billing;
  const rows = billingRows(ym);
  const pend = rows.filter(r => !r.invoice && r.total > 0), done = rows.filter(r => r.invoice);
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const unused = pend.reduce((a, r) => a + r.pending, 0);
  const finding = !rows.length ? "No hubo alquileres en este mes."
    : pend.length ? `Hay <b>${pend.length} ${pend.length === 1 ? "profesional" : "profesionales"} para facturar</b> por ${money(pend.reduce((a, r) => a + r.total, 0))}.${ym === nowYm && unused ? ` El mes no terminó: ${unused} ${unused === 1 ? "turno todavía no se usó" : "turnos todavía no se usaron"}.` : ""}`
    : `Todo facturado: ${done.length} ${done.length === 1 ? "factura" : "facturas"} por ${money(done.reduce((a, r) => a + r.invoice.total, 0))}.`;
  const act = (r) => r.invoice ? `<button class="btn btn-sm" data-action="inv-open" data-id="${r.invoice.id}">Ver</button>` : `<button class="btn btn-sm" data-action="inv-one" data-id="${r.u.id}">Facturar</button>`;
  return `
  <div class="title-row"><div>
    <h1>Facturación</h1>
    <p class="sub">Las horas que alquiló cada profesional en el mes, con su precio. Se factura todo junto: una factura por profesional.</p>
    <p class="finding">${finding}</p>
  </div><button class="btn btn-primary" data-action="inv-all" ${pend.length ? "" : "disabled"}>Facturar todo el mes</button></div>
  <div class="cal-head"><span class="wk">${cap(ymLabel(ym))}</span>
    <button class="btn btn-sm" data-action="inv-month" data-go="now">Este mes</button>
    <button class="iconbtn" data-action="inv-month" data-go="-1" aria-label="Mes anterior">${ic("chevL")}</button>
    <button class="iconbtn" data-action="inv-month" data-go="1" aria-label="Mes siguiente" ${ym >= nowYm ? "disabled" : ""}>${ic("chevR")}</button></div>
  ${rows.length ? `
  <div class="panel"><div class="panel-b" style="padding-top:8px">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Profesional</th><th class="num">Horas</th><th class="num">Boxes</th><th class="num">Máquinas</th><th class="num">Total</th><th>Factura</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><div class="t">${esc(r.u.name)}</div><div class="s">${esc(catOf(r.u).name)} · CUIT ${esc(r.u.cuit || "sin cargar")}</div></td>
        <td class="num">${r.hours} h</td><td class="num">${money(r.boxAmount)}</td><td class="num">${r.machAmount ? money(r.machAmount) : "—"}</td><td class="num"><b>${money(r.total)}</b></td>
        <td>${r.invoice ? `<span class="pill pill-positive">Facturada</span><div class="s num">${r.invoice.letter} ${r.invoice.number}</div>` : `<span class="pill pill-warning">Sin facturar</span>`}</td><td class="num">${act(r)}</td></tr>`).join("")}
        <tr class="tot"><td>Total del mes</td><td class="num">${sum("hours")} h</td><td class="num">${money(sum("boxAmount"))}</td><td class="num">${sum("machAmount") ? money(sum("machAmount")) : "—"}</td><td class="num">${money(sum("total"))}</td><td></td><td></td></tr></tbody>
    </table></div>
    <div class="mrows">${rows.map(r => `<div class="mrow" style="cursor:default"><div class="main"><div class="l1"><span>${esc(r.u.name)}</span><span class="num">${money(r.total)}</span></div>
      <div class="l2">${r.hours} h de box${r.machAmount ? " · máquinas " + money(r.machAmount) : ""}</div>
      <div class="inv-line">${r.invoice ? `<span class="pill pill-positive">Facturada · ${r.invoice.letter} ${r.invoice.number}</span>` : `<span class="pill pill-warning">Sin facturar</span>`}${act(r)}</div></div></div>`).join("")}</div>

  const list = groups[tab];
  const row = (u) => {
    const nb = S.bookings.filter(b => b.userId === u.id && active(b) && b.status !== "cumplida").length;
    let acts = "";
    if (u.status === "pendiente") acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="rechazado">Rechazar</button><button class="btn btn-sm btn-primary" data-action="user-status" data-id="${u.id}" data-s="aprobado">Aprobar</button>`;
    else if (u.status === "aprobado") acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="bloqueado">Pausar acceso</button>`;
    else acts = `<button class="btn btn-sm" data-action="user-status" data-id="${u.id}" data-s="aprobado">Habilitar</button>`;

      <div class="main"><div class="t">${esc(u.name)} ${u.status === "rechazado" ? '<span class="pill pill-negative">Rechazada</span>' : u.status === "bloqueado" ? '<span class="pill pill-neutral">Pausada</span>' : ""}</div>
      <div class="s">${esc(u.profession)} · ${esc(u.email)} · ${esc(u.phone)}</div>
      <div class="s catline"><label>Categoría <select class="input input-sm" data-input="userCat" data-id="${u.id}">${S.config.categories.map(k => `<option value="${k.id}" ${k.id === catOf(u).id ? "selected" : ""}>${esc(k.name)} · ${money(k.pricePerHour)} la hora</option>`).join("")}</select></label></div>

    <button role="tab" aria-selected="${tab === "pausadas"}" data-action="tab" data-k="prof" data-v="pausadas">Pausadas y rechazadas<span class="n num">${groups.pausadas.length}</span></button>
  </div>
  <div class="panel"><div class="panel-b" style="padding-top:8px">${list.length ? `<ul class="list">${list.map(row).join("")}</ul>` : `<div class="empty"><b>No hay nadie acá</b>${tab === "solicitudes" ? "Las nuevas solicitudes de acceso aparecen en esta pestaña." : ""}</div>`}</div></div>`;

/* =========================================================
   Hojas (bottom sheet / diálogo)
   ========================================================= */
let overlayEl = null, lastFocus = null;
function openSheet(html, { wide = false } = {}) {
  if (overlayEl) { // ya hay una hoja abierta: reemplazamos el contenido sin animar
    const sh = overlayEl.querySelector(".sheet");
    sh.className = "sheet" + (wide ? " wide" : "");
    sh.innerHTML = html; sh.scrollTop = 0;
    return;
  }
  lastFocus = document.activeElement;
  overlayEl = document.createElement("div");
  overlayEl.className = "overlay";
  overlayEl.innerHTML = `<div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(overlayEl);
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => overlayEl && overlayEl.classList.add("open"));
  const f = overlayEl.querySelector("[autofocus], .sheet-b input, .sheet-b button, .sheet-f .btn-primary");
  setTimeout(() => (f || overlayEl.querySelector(".sheet")).focus?.(), 60);
  overlayEl.addEventListener("mousedown", (e) => { if (e.target === overlayEl) closeSheet(); });
}
function closeSheet(instant = false) {
  if (!overlayEl) return;
  const el = overlayEl; overlayEl = null;
  document.body.style.overflow = "";
  if (instant) el.remove(); else { el.classList.remove("open"); setTimeout(() => el.remove(), 260); } // 260 ms: lo que tarda la hoja en bajar en el celular
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus?.();
}
const sheetHead = (title, sub = "") => `<div class="sheet-h"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div><button class="iconbtn x" data-action="close-sheet" aria-label="Cerrar">${ic("x")}</button></div>`;

/* ---------- Flujo de reserva (3 pasos) ---------- */
let draft = null;
function startBooking(boxId, date, start, end) {
  const u = me();
  if (u.status !== "aprobado") { toast("Solo las profesionales aprobadas pueden reservar."); return; } // RN01
  if (!canBook(boxId, date, start, end)) { toast("Ese horario ya no está disponible."); render(); return; }
  draft = { boxId, date, start, end, step: 1, service: "", plan: "sena", accepted: false, machines: [] };
  renderBookingSheet();
}
function draftBox() { return priceFor(draft.end - draft.start, me(), draft.boxId); }
function draftMachines() { const h = draft.end - draft.start; return draft.machines.map(machineById).filter(Boolean).map(m => machineLine(m, h)); }
function draftTotal() { return draftBox() + draftMachines().reduce((a, m) => a + m.amount, 0); }
function draftAmount() { return draft.plan === "sena" ? senaOf(draftTotal()) : draftTotal(); }
function renderBookingSheet(keepScroll = false) {
  const d = draft, box = boxById(d.boxId), total = draftTotal(), c = S.config, p = c.policy, hrs = d.end - d.start, ml = draftMachines();
  const isRel = releasesFor(d.date, d.boxId).some(r => r.start <= d.start && r.end >= d.end);
  const steps = ["Turno", "Pago", "Reglamento"].map((s, i) => `<span class="${i + 1 === d.step ? "on" : i + 1 < d.step ? "done" : ""}">${s}</span>`).join("");
  const summary = `<div class="summary"><b>${esc(box.name)}${isRel ? " · rato libre" : ""}</b><b class="r num">${money(total)}</b><span class="muted">${cap(fmtDay(d.date))}</span><span class="muted r num">${fmtRange(d.start, d.end)}</span>
    <span class="muted">Box: ${hrs} h a ${money(rateOf(me(), box))}</span><span class="muted r num">${money(draftBox())}</span>${ml.map(m => `<span class="muted">${esc(m.name)}: ${m.hours} h a ${money(m.rate)}</span><span class="muted r num">${money(m.amount)}</span>`).join("")}</div>`;
  const avail = S.machines.filter(m => m.active);
  const mach = !avail.length ? "" : `<div class="group-l">¿Sumás una máquina?</div>
      ${avail.map(m => { const busy = machineBusy(m.id, d.date, d.start, d.end);
        return `<label class="choice ${busy ? "is-off" : ""}"><input type="checkbox" data-draft-machine="${m.id}" ${d.machines.includes(m.id) ? "checked" : ""} ${busy ? "disabled" : ""}><div><div class="ct">${esc(m.name)}</div><div class="cs">${busy ? "Ya está reservada en este horario" : esc(m.short || "")}</div></div><span class="camt num">${busy ? "" : "+ " + money(m.pricePerHour * hrs)}</span></label>`; }).join("")}
      <p class="muted small">Las máquinas se cobran por hora, por las ${hrs} h del turno.</p>`;
  let body = "", foot = "";
  if (d.step === 1) {
    body = `
      <div class="group-l">Qué tiene el box</div>
      <ul class="eq" style="margin-bottom:6px">${box.equipment.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
      ${mach}
      <div class="field" style="margin-top:18px"><label for="svc">¿Qué vas a atender?</label><input class="input" id="svc" data-draft="service" value="${esc(d.service)}" placeholder="Ej.: Dermatología"><span class="hint">Solo lo ve Yani. Las demás profesionales ven este horario como “Ocupado”.</span></div>`;
    foot = `<button class="btn" data-action="close-sheet">Cancelar</button><button class="btn btn-primary" data-action="draft-next">Continuar</button>`;
  } else if (d.step === 2) {
    const sena = senaOf(total);
    body = `
      <div class="group-l">¿Cuánto pagás ahora?</div>
      <label class="choice"><input type="radio" name="plan" value="sena" data-draft="plan" ${d.plan === "sena" ? "checked" : ""}><div><div class="ct">Seña del ${c.depositPct} %</div><div class="cs">El resto (${money(total - sena)}) lo pagás antes del turno</div></div><span class="camt num">${money(sena)}</span></label>
      <label class="choice"><input type="radio" name="plan" value="total" data-draft="plan" ${d.plan === "total" ? "checked" : ""}><div><div class="ct">Total</div><div class="cs">Y te olvidás del saldo</div></div><span class="camt num">${money(total)}</span></label>
      <div class="group-l">Pagás con Mercado Pago</div>
      <div class="mp-head is-line"><div class="mp-logo">MP</div><div><b>Tarjeta o dinero en cuenta</b><div class="muted small">Se confirma al instante.</div></div></div>
      <div class="note">Si cancelás con ${p.days} días o más, te devolvemos el ${d.plan === "sena" ? p.senaBefore : p.totalBefore} %. Con menos, ${d.plan === "sena" ? (p.senaAfter ? `el ${p.senaAfter} %` : "la seña no se devuelve") : `el ${p.totalAfter} %`}.</div>`;
    foot = `<button class="btn" data-action="draft-back">Atrás</button><button class="btn btn-primary" data-action="draft-next">Continuar</button>`;
  } else {
    body = `
      <div class="group-l">Reglamento de uso del consultorio <span class="muted" style="font-weight:400">· versión ${c.terms.version}</span></div>
      <div class="terms"><ol>${c.terms.text.split("\n").filter(Boolean).map(l => `<li>${esc(l)}</li>`).join("")}</ol></div>
      <label class="check" style="margin-top:14px"><input type="checkbox" data-draft="accepted" ${d.accepted ? "checked" : ""}><span>Leí y acepto el reglamento de uso y la política de cancelación.</span></label>
      <div class="note acc">Vas a pagar <b class="num">${money(draftAmount())}</b> ${d.plan === "sena" ? "de seña" : ""} con Mercado Pago. Tenés ${c.mpMinutes} minutos para completar el pago.</div>`;
    foot = `<button class="btn" data-action="draft-back">Atrás</button><button class="btn btn-primary" data-action="draft-confirm" ${d.accepted ? "" : "disabled"} id="confirmBtn">Ir a pagar ${money(draftAmount())}</button>`;
  }
  openSheet(`${sheetHead("Reservar " + esc(box.name), "Paso " + d.step + " de 3")}<div class="sheet-b"><div class="steps">${steps}</div>${summary}${body}</div><div class="sheet-f">${foot}</div>`);
}

function confirmDraft() {
  const d = draft, u = me();
  if (!d.accepted) { toast("Tenés que aceptar el reglamento para reservar."); return; } // RN05
  if (!canBook(d.boxId, d.date, d.start, d.end)) { closeSheet(); toast("Alguien reservó ese horario recién. Elegí otro."); render(); return; } // RN02
  const taken = d.machines.find(id => !machineById(id) || machineBusy(id, d.date, d.start, d.end));
  if (taken) { // alguien se llevó la máquina mientras se completaba la reserva
    d.machines = d.machines.filter(id => id !== taken); d.step = 1; renderBookingSheet();
    toast("Esa máquina se reservó recién en ese horario. La sacamos de tu reserva: revisá el total."); return;
  }
  const now = Date.now();
  const b = {
    id: uid("r"), userId: u.id, boxId: d.boxId, date: d.date, start: d.start, end: d.end, service: d.service.trim(),
    category: u.category, rate: rateOf(u, boxById(d.boxId)), boxAmount: draftBox(), machines: draftMachines(),
    total: draftTotal(), plan: d.plan, status: "pago", payments: [], termsVersion: S.config.terms.version,
    createdAt: now, expiresAt: now + S.config.mpMinutes * 6e4, refund: null,
  };
  S.bookings.push(b);
  draft = null;
  save(); render();
  openMp(b, b.plan);
}

/* ---------- Mercado Pago simulado (RF13, RN08) ---------- */
function openMp(b, kind) {
  const amount = kind === "saldo" ? balanceOf(b) : kind === "sena" ? senaOf(b.total) : b.total;
  openSheet(`${sheetHead("Pagar con Mercado Pago", "Simulación: en la app real se abre Mercado Pago")}

  </div>
  <div class="sheet-f"><button class="btn" data-action="mp-reject" data-id="${b.id}">Simular rechazo</button><button class="btn btn-primary" data-action="mp-approve" data-id="${b.id}" data-kind="${kind}">Pagar ${money(amount)}</button></div>`);

function mpApprove(b, kind) {
  const amount = kind === "saldo" ? balanceOf(b) : kind === "sena" ? senaOf(b.total) : b.total;
  const p = { id: uid("p"), kind, amount, status: "pendiente", at: Date.now() };
  b.payments.push(p);
  approvePayment(b, p);
  save(); render();
  showSuccess(b, kind === "saldo" ? "¡Listo! Pagaste el saldo" : "¡Reserva confirmada!", kind === "saldo" ? "Tu turno está pago completo." : "Te mandamos un mail con los datos. Te vamos a recordar el turno el día anterior.");
}

/* ---------- Cancelación con devolución calculada (RF16, RF17) ---------- */

  const daysTxt = r.days >= 1 ? `Faltan ${Math.floor(r.days)} ${Math.floor(r.days) === 1 ? "día" : "días"}` : `Faltan menos de 24 h`;
  const unpaid = r.paid === 0;
  const hitBefore = r.before, hitFull = r.full;
  openSheet(`${sheetHead(by === "admin" ? "Cancelar esta reserva" : "¿Cancelar tu reserva?", `${esc(box.name)} · ${cap(fmtDay(b.date))} · ${fmtRange(b.start, b.end)}`)}
  <div class="sheet-b">
    ${unpaid ? `<div class="note">Todavía no hay pagos aprobados en esta reserva, así que no hay nada para devolver. El horario se libera para otra persona.</div>`

        <tbody>
          <tr class="${hitBefore ? "hit" : ""}"><td>Con ${p.days} días o más</td><td class="num">${p.senaBefore} %</td><td class="num">${p.totalBefore} %</td></tr>
          <tr class="${!hitBefore ? "hit" : ""}"><td>Con menos de ${p.days} días</td><td class="num">${p.senaAfter} %</td><td class="num">${p.totalAfter} %</td></tr>
        </tbody></table>
      <p class="muted small" style="margin-top:8px">Tu caso: ${daysTxt.toLowerCase()} y ${hitFull ? "pagaste el total" : "pagaste la seña"}.</p>` : ""}
      <div class="note ${r.amount ? "acc" : "warn"}">${r.amount === 0 ? "Según la política de cancelación, no corresponde devolución." : "La devolución vuelve sola a la cuenta de Mercado Pago."}</div>`}

/* Achica la foto elegida (lado mayor de 1100 px) y la devuelve lista para guardar */
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) { reject(new Error("no es una imagen")); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1100 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("no se pudo leer")); };
    img.src = url;
  });
}

function stepFx(dir) {
  const el = overlayEl?.querySelector(".sheet-b");
  if (!el || !el.animate) return;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.animate([{ opacity: 0, transform: calm ? "none" : `translateX(${dir * 10}px)` }, { opacity: 1, transform: "none" }], { duration: 220, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
}

document.addEventListener("click", (e) => {
  const navEl = e.target.closest("[data-nav]");

  const a = el.dataset.action, ds = el.dataset;
  switch (a) {
    case "close-sheet": closeSheet(); break;
    case "reset-demo":
      try { localStorage.removeItem(KEY); } catch (err) { }

    case "auth-tab": S.ui.authTab = ds.tab; render(); break;
    case "login-as": S.session.userId = ds.id; S.ui.view = null; S.ui.calPicked = false; render(); break;
    case "tab": S.ui.tab[ds.k] = ds.v; render(); break;
    case "cal-day": S.ui.calDate = ds.date; S.ui.calPicked = true; fx = "cal"; render(); break;
    case "cal-today": S.ui.calDate = todayIso(); fx = "cal"; render(); break;
    case "cal-week": S.ui.calDate = addDays(mondayOf(S.ui.calDate), 7 * Number(ds.dir)); fx = "cal"; render(); break;
    case "go-agenda-today": S.ui.calDate = todayIso(); go("agenda"); break;
    case "ag-view": S.ui.agView = ds.v; fx = "cal"; render(); break;
    case "ag-day": S.ui.calDate = ds.date; S.ui.agView = "dia"; S.ui.calPicked = true; fx = "cal"; render(); window.scrollTo(0, 0); break;
    case "ag-move": {
      const v = agView(), dir = +ds.dir;
      if (v === "mes") S.ui.calDate = ymAdd(ymOf(S.ui.calDate), dir) + "-01";
      else S.ui.calDate = addDays(v === "semana" ? mondayOf(S.ui.calDate) : S.ui.calDate, dir * (v === "semana" ? 7 : agDays()));
      fx = "cal"; render(); break;
    }
    case "go-mis": S.ui.tab.mis = "proximas"; go("mis"); break;
    case "book": startBooking(+ds.box, ds.date, +ds.start, +ds.end); break;
    case "draft-next":
      if (draft.step === 1) draft.service = ($("#svc")?.value || "").trim();
      draft.step++; renderBookingSheet(); stepFx(1); break;
    case "draft-back": draft.step--; renderBookingSheet(); stepFx(-1); break;
    case "draft-confirm": confirmDraft(); break;
    case "my-booking": { const b = findB(ds.id); S.ui.tab.mis = ["cumplida", "cancelada"].includes(b.status) ? "historial" : "proximas"; go("mis"); break; }
    case "pay-now": openMp(findB(ds.id), findB(ds.id).plan); break;

    }
    case "inv-open": openInvoice(S.invoices.find(i => i.id === ds.id)); break;
  }

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "as") { S.session.userId = t.value || null; S.ui.view = null; S.ui.calPicked = false; closeSheet(true); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.upload) { // fotos de boxes y de máquinas
    const kind = t.dataset.upload, boxId = +t.dataset.id, form = t.closest("form");
    readImage(t.files && t.files[0]).then((data) => {
      if (kind === "box") { if (form) applyBoxesForm(new FormData(form)); boxById(boxId).photo = data; render(); toast(save() ? "Foto guardada." : FULL); }
      else { machinePhoto = data; const ph = $("#mPhoto"); if (ph) ph.innerHTML = machinePhotoHtml(); }
    }).catch(() => toast("No pudimos leer esa imagen. Probá con una foto JPG o PNG."));
    return;
  }
  if (t.dataset.input === "agDays") { S.ui.agDays = Math.min(31, Math.max(1, Math.round(+t.value) || 1)); fx = "cal"; render(); return; }
  if (t.dataset.input === "userCat") {
    const u = userById(t.dataset.id); u.category = t.value; render();
    toast(`${u.name} pasó a ${catOf(u).name}: ${money(rateOf(u))} la hora en sus reservas nuevas.`); return;
  }
  if (t.dataset.draftMachine && draft) {
    const id = t.dataset.draftMachine;
    draft.machines = t.checked ? [...draft.machines.filter(x => x !== id), id] : draft.machines.filter(x => x !== id);
    const sh = overlayEl?.querySelector(".sheet"), st = sh ? sh.scrollTop : 0;
    renderBookingSheet(); if (overlayEl) overlayEl.querySelector(".sheet").scrollTop = st;
    return;
  }
  if (t.dataset.draft && draft) {
    const k = t.dataset.draft;
    if (k === "accepted") { draft.accepted = t.checked; const btn = $("#confirmBtn"); if (btn) btn.disabled = !t.checked; return; }
    draft[k] = t.value;
    if (k === "plan") { const sh = overlayEl?.querySelector(".sheet"); const st = sh ? sh.scrollTop : 0; renderBookingSheet(); if (overlayEl) overlayEl.querySelector(".sheet").scrollTop = st; }
    return;
  }
  if (t.dataset.input === "resBox") { S.ui.resBox = t.value; render(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.input === "resQ") { S.ui.resQ = t.value; const pos = t.selectionStart; render(); const n = $('[data-input="resQ"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (t.dataset.draft === "service" && draft) draft.service = t.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlayEl) closeSheet();
  if (e.key === "Enter" && e.target.matches("tr.click, .slot.click")) e.target.click();
});

document.addEventListener("submit", (e) => {
  const f = e.target, kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  const c = S.config;
  switch (kind) {
    case "login": {
      const email = String(fd.get("email")).trim().toLowerCase();
      const u = S.users.find(x => x.email.toLowerCase() === email);
      if (!u) { toast("No encontramos ese mail. Probá con una cuenta de ejemplo."); return; }
      S.session.userId = u.id; S.ui.view = null; render(); break;
    }
    case "register": {
      const email = String(fd.get("email")).trim();
      if (S.users.some(x => x.email.toLowerCase() === email.toLowerCase())) { toast("Ya hay una cuenta con ese mail."); return; }
      const u = { id: uid("u"), role: "pro", name: String(fd.get("name")).trim(), profession: String(fd.get("profession")).trim(), category: String(fd.get("category") || S.config.categories[0].id), cuit: String(fd.get("cuit") || "").trim(), email, phone: String(fd.get("phone") || "").trim() || "—", status: "pendiente", since: Date.now() };
      S.users.push(u);
      mail(u.id, "Recibimos tu solicitud", `Hola ${u.name.split(" ")[0]}:\n\nRecibimos tu solicitud para alquilar boxes. Yani te va a contactar para coordinar una entrevista.\n\nConsultorio Yani`);
      mail("u0", `Nueva solicitud de acceso: ${u.name}`, `${u.name} (${u.profession}, categoría ${catOf(u).name}) pidió acceso para alquilar boxes.\nTeléfono: ${u.phone}\nMail: ${u.email}\n\nCoordiná la entrevista y después aprobala desde el panel.`);
      S.session.userId = u.id; S.ui.view = null; S.ui.authTab = "login"; render(); toast("Solicitud enviada."); break;
    }
    case "add-pro": {
      const u = { id: uid("u"), role: "pro", name: String(fd.get("name")).trim(), profession: String(fd.get("profession")).trim(), category: String(fd.get("category") || S.config.categories[0].id), cuit: String(fd.get("cuit") || "").trim(), email: String(fd.get("email")).trim(), phone: String(fd.get("phone") || "").trim() || "—", status: "aprobado", since: Date.now() };
      S.users.push(u);
      mail(u.id, "Tu cuenta para reservar boxes", `Hola ${u.name.split(" ")[0]}:\n\nYani te creó una cuenta para alquilar boxes.\nUsuario: ${u.email}\nContraseña temporal: (se genera en la app real)\n\nConsultorio Yani`);
      closeSheet(); S.ui.tab.prof = "aprobadas"; render(); toast(`Cuenta creada para ${u.name}.`); break;
    }
    case "new-block": {
      const boxes = fd.getAll("boxes").map(Number);
      const date = String(fd.get("date")), start = +fd.get("start"), end = +fd.get("end");
      if (!boxes.length) { toast("Elegí al menos un box."); return; }
      if (end <= start) { toast("La hora de fin tiene que ser posterior al inicio."); return; }
      const weekly = fd.get("rep") === "weekly";
      const clash = S.bookings.filter(b => active(b) && boxes.includes(b.boxId) && b.start < end && b.end > start && (weekly ? weekday(b.date) === weekday(date) && b.date >= todayIso() : b.date === date));
      const bl = { id: uid("bl"), boxIds: boxes, recurring: weekly, start, end, note: String(fd.get("note") || "").trim() || "Lo uso yo" };
      if (weekly) bl.weekday = weekday(date); else bl.date = date;
      S.blocks.push(bl);
      closeSheet(); S.ui.calDate = date; render();
      toast(clash.length ? `Bloqueado. Ojo: ${clash.length} ${clash.length === 1 ? "reserva ya tomada sigue" : "reservas ya tomadas siguen"} en pie en ese horario.` : weekly ? `Bloqueado todos los ${DIAS[weekday(date)]}.` : "Horario bloqueado.");
      break;
    }
    case "release": {
      const start = +fd.get("start"), end = +fd.get("end");
      if (end <= start) { toast("La hora de fin tiene que ser posterior al inicio."); return; }
      S.releases.push({ id: uid("rl"), boxId: +f.dataset.box, date: f.dataset.date, start, end });
      closeSheet(); render(); toast(`Publicaste un rato libre de ${end - start} h.`); break;
    }
    case "cfg-turnos": {
      const open = +fd.get("open"), close = +fd.get("close"), th = +fd.get("turnHours");
      if (close <= open) { toast("El cierre tiene que ser después de la apertura."); return; }
      if ((close - open) % th !== 0) { toast(`Con turnos de ${th} h, el horario de ${open} a ${close} no cierra justo. Probá otro.`); return; }
      c.turnHours = th; c.open = open; c.close = close; c.days = fd.getAll("days").map(Number);
      render(); toast("Guardado. La agenda ya usa los nuevos turnos."); break;
    }
    case "cfg-precio": c.depositPct = +fd.get("depositPct"); c.mpMinutes = +fd.get("mpMinutes"); render(); toast("Seña y plazo guardados."); break;
    case "cfg-politica": ["days", "senaBefore", "senaAfter", "totalBefore", "totalAfter"].forEach(k => c.policy[k] = +fd.get(k)); render(); toast("Política de cancelación guardada."); break;
    case "cfg-terms": { const txt = String(fd.get("text")).trim(); if (txt !== c.terms.text) { c.terms.text = txt; c.terms.version++; } render(); toast(`Reglamento guardado (versión ${c.terms.version}).`); break; }
    case "cfg-boxes": applyBoxesForm(fd); render(); toast("Boxes guardados."); break;
    case "cat-save": {
      const name = String(fd.get("name")).trim(), price = Math.max(0, +fd.get("pricePerHour") || 0);
      if (!name) { toast("Poné un nombre para la categoría."); return; }
      let k = c.categories.find(x => x.id === f.dataset.id);
      if (!k) { k = { id: uid("c") }; c.categories.push(k); }
      k.name = name; k.note = String(fd.get("note") || "").trim(); k.pricePerHour = price;
      closeSheet(); render(); toast(`Guardado: ${name}, ${money(price)} la hora.`); break;
    }
    case "machine-save": {
      const name = String(fd.get("name")).trim();
      if (!name) { toast("Poné el nombre de la máquina."); return; }
      let m = machineById(f.dataset.id);
      if (!m) { m = { id: uid("m") }; S.machines.push(m); }
      m.name = name; m.short = String(fd.get("short") || "").trim(); m.pricePerHour = Math.max(0, +fd.get("pricePerHour") || 0);
      m.active = fd.get("active") === "on"; m.photo = machinePhoto;
      closeSheet(); render(); toast(save() ? `Guardado: ${name}, ${money(m.pricePerHour)} la hora.` : FULL); break;
    }
    case "cfg-billing": {
      const b = c.billing;
      b.name = String(fd.get("name")).trim() || b.name; b.cuit = String(fd.get("cuit")).trim(); b.cond = String(fd.get("cond")); b.pos = Math.min(9998, Math.max(1, +fd.get("pos") || 1));
      render(); toast("Datos de facturación guardados."); break;
    }
  }
});

/* Contadores de pago (RN10) */
function tick() {
  const now = Date.now();
  const nl = $(".nowline"); // la línea de la hora actual acompaña al reloj
  if (nl) { const d = new Date(now), h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; nl.style.top = `calc(var(--ph) * ${(h - +nl.dataset.open).toFixed(3)})`; nl.hidden = h >= +nl.dataset.close; }
  $$("[data-countdown]").forEach(el => {
    const left = Math.max(0, +el.dataset.countdown - now);
    const m = Math.floor(left / 6e4), s = Math.floor(left % 6e4 / 1e3);
    el.textContent = left > 36e5 ? `Quedan ${Math.floor(left / 36e5)} h ${pad(m % 60)} min` : `Quedan ${m}:${pad(s)}`;
  });
}
setInterval(() => {
  tick();
  if (autoUpdate()) { save(); if (!overlayEl) render(); else renderDemoBar(); }
}, 1000);

load();
paintTheme();
render();
tick();
</script>
